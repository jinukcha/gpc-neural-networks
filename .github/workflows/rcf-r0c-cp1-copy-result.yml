name: RCF R0C CP1 copy compact accepted results

on:
  push:
    branches: [automation/rcf-r0c-cp1-20260925]
    paths: [.github/workflows/rcf-r0c-cp1-copy-result.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/rcf-r0c-cp1-20260925
          fetch-depth: 0
      - name: Download accepted compact reports
        shell: bash
        run: |
          set -euo pipefail
          rm -rf c1_result
          mkdir -p c1_result
          base=https://github.com/jinukcha/gpc-neural-networks/releases/download/rcf-r0c-cp1-20260925-r1
          for f in C1.json C1.md C1.txt C1.sha256 C1_delivery.json C1_check.json C1_impl_check.json C1_impl_state.json C1_pre_check.json; do
            curl -L --fail --retry 3 -o "c1_result/$f" "$base/$f"
          done
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          root=Path('c1_result')
          report={}
          for path in sorted(root.iterdir()):
              report[path.name]={'bytes':path.stat().st_size,'sha256':hashlib.sha256(path.read_bytes()).hexdigest()}
              if path.suffix=='.json': json.loads(path.read_text())
          (root/'DOWNLOAD_RECEIPT.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          PY
      - name: Commit compact accepted reports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add c1_result
          git commit -m 'Record compact accepted R0C CP1 result reports'
          git push origin HEAD:automation/rcf-r0c-cp1-20260925
