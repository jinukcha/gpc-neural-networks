name: CP2B Warp CP1 inspect recovery receipts

on:
  push:
    branches:
      - cp2b-warp-cp1-20260930

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cp2b-warp-cp1-20260930
          persist-credentials: false

      - name: Download preserved R4 recovery bundle
        uses: actions/download-artifact@v4
        with:
          name: WG_OSS_R0A_CP2B_R4_RECOVERY_FINAL
          path: received
          github-token: ${{ github.token }}
          repository: jinukcha/gpc-neural-networks
          run-id: 36672145048

      - name: Print recovery authority and mesh receipts
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/received"
          echo '=== ALL JSON ==='
          for p in $(find "$root" -type f -name '*.json' | sort); do
            echo "--- ${p#$root/} ---"
            cat "$p"
            echo
          done
          echo '=== BLEND/GLB HASHES ==='
          find "$root" -type f \( -name '*.blend' -o -name '*.glb' \) -print0 | sort -z | xargs -0 sha256sum
          echo '=== SOURCE FILES ==='
          for p in $(find "$root/source" -type f -name '*.py' | sort); do
            echo "--- ${p#$root/} ---"
            sed -n '1,360p' "$p"
          done
