name: Garment R1C CP4-R2-R1 Art Audit Extract

on:
  push:
    branches:
      - garment-cad-pro-r1c-cp4-r2-r1-20261002

permissions:
  actions: read
  contents: write

concurrency:
  group: garment-cad-pro-r1c-cp4-r2-r1-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: garment-cad-pro-r1c-cp4-r2-r1-20261002
          persist-credentials: true

      - name: Download accepted metric candidate
        uses: actions/download-artifact@v4
        with:
          name: GARMENT_R1C_CP4_R2_R1_CANDIDATE
          path: ${{ runner.temp }}/candidate
          repository: jinukcha/gpc-neural-networks
          run-id: 36997823624
          github-token: ${{ github.token }}

      - name: Install bounded audit tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir \
            numpy==2.5.3 pillow==11.1.0 scipy==1.16.3

      - name: Extract textual direct-art evidence
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/candidate" delivery_r1c_cp4_r2_r1_audit <<'PY'
          from __future__ import annotations
          import json, pathlib, sys
          import numpy as np
          from PIL import Image
          from scipy import ndimage

          root=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2])
          out.mkdir(parents=True,exist_ok=True)
          before_dir=root/'build/r1c_cp4_r1/visual'
          after_dir=root/'build/r1c_cp4_r2_r1/visual/after'
          views=(
              'front','left','right','back','front_three_quarter','back_three_quarter',
              'garment_only','shoulder_cap_detail','underarm_detail','neck_collar_detail',
              'wireframe_front','seam_notch_overlay',
          )
          detail={'shoulder_cap_detail','underarm_detail','neck_collar_detail'}
          chars=np.asarray(list(' .:-=+*#%@'))

          def rgb(path):
              return np.asarray(Image.open(path).convert('RGB'),dtype=np.float32)

          def background(image):
              border=np.concatenate((image[:12].reshape(-1,3),image[-12:].reshape(-1,3),image[:, :12].reshape(-1,3),image[:, -12:].reshape(-1,3)))
              return np.median(border,axis=0)

          def mask(image):
              bg=background(image)
              distance=np.linalg.norm(image-bg,axis=2)
              raw=distance>22.0
              raw=ndimage.binary_closing(raw,iterations=2)
              raw=ndimage.binary_fill_holes(raw)
              return raw

          def bbox(binary):
              rows,cols=np.where(binary)
              if len(rows)==0: return [0,0,0,0]
              return [int(cols.min()),int(rows.min()),int(cols.max()+1),int(rows.max()+1)]

          def components(binary):
              labels,count=ndimage.label(binary)
              sizes=np.bincount(labels.ravel())[1:]
              sizes=np.sort(sizes)[::-1] if len(sizes) else np.asarray([],dtype=int)
              foreground=max(int(np.count_nonzero(binary)),1)
              return {
                  'count':int(count),
                  'largest_fraction':float(sizes[0]/foreground) if len(sizes) else 0.0,
                  'second_fraction':float(sizes[1]/foreground) if len(sizes)>1 else 0.0,
                  'small_component_count':int(np.count_nonzero(sizes<max(24,foreground*0.0005))),
              }

          def holes(binary):
              inverse=~binary
              labels,count=ndimage.label(inverse)
              border=set(np.unique(np.concatenate((labels[0],labels[-1],labels[:,0],labels[:,-1]))).tolist())
              areas=np.bincount(labels.ravel())
              values=[int(areas[index]) for index in range(1,count+1) if index not in border and areas[index]>24]
              return {'count':len(values),'areas_px':sorted(values,reverse=True)[:12]}

          def contour(binary):
              eroded=ndimage.binary_erosion(binary)
              edge=binary & ~eroded
              perimeter=int(np.count_nonzero(edge))
              area=max(int(np.count_nonzero(binary)),1)
              return {'perimeter_px':perimeter,'area_px':area,'roughness':float(perimeter/(area**0.5))}

          def downsample(values,width,height):
              image=Image.fromarray(np.uint8(np.clip(values,0,255)))
              return np.asarray(image.resize((width,height),Image.Resampling.BOX),dtype=np.float32)

          def ascii_luma(image,width,height):
              luma=0.2126*image[:,:,0]+0.7152*image[:,:,1]+0.0722*image[:,:,2]
              sample=downsample(luma,width,height)
              index=np.clip((sample/255.0*(len(chars)-1)).astype(int),0,len(chars)-1)
              return '\n'.join(''.join(chars[row]) for row in index)

          def ascii_edges(image,width,height):
              luma=0.2126*image[:,:,0]+0.7152*image[:,:,1]+0.0722*image[:,:,2]
              gx=ndimage.sobel(luma,axis=1); gy=ndimage.sobel(luma,axis=0)
              magnitude=np.hypot(gx,gy)
              cap=max(float(np.quantile(magnitude,0.985)),1.0)
              sample=downsample(np.clip(magnitude/cap*255.0,0,255),width,height)
              index=np.clip((sample/255.0*(len(chars)-1)).astype(int),0,len(chars)-1)
              return '\n'.join(''.join(chars[row]) for row in index)

          def silhouette_metrics(left,right):
              lm,rm=mask(left),mask(right)
              union=np.count_nonzero(lm|rm); inter=np.count_nonzero(lm&rm)
              lb,rb=bbox(lm),bbox(rm)
              return {
                  'iou':float(inter/max(union,1)),
                  'foreground_fraction_before':float(np.mean(lm)),
                  'foreground_fraction_after':float(np.mean(rm)),
                  'bbox_before':lb,'bbox_after':rb,
                  'bbox_width_delta_px':int((rb[2]-rb[0])-(lb[2]-lb[0])),
                  'bbox_height_delta_px':int((rb[3]-rb[1])-(lb[3]-lb[1])),
                  'components_before':components(lm),'components_after':components(rm),
                  'holes_before':holes(lm),'holes_after':holes(rm),
                  'contour_before':contour(lm),'contour_after':contour(rm),
                  'mean_absolute_rgb_delta':float(np.mean(np.abs(left-right))),
              }

          diagnostics={}
          for view in views:
              before=rgb(before_dir/f'{view}.png'); after=rgb(after_dir/f'{view}.png')
              diagnostics[view]=silhouette_metrics(before,after)
              width=96 if view in detail else 80
              height=56 if view in detail else 44
              text=(
                  f'VIEW: {view}\n'
                  f'FORMAT: same-camera Blender 5.2.2; BEFORE=CP4-R1; AFTER=CP4-R2-R1\n\n'
                  f'BEFORE LUMINANCE\n{ascii_luma(before,width,height)}\n\n'
                  f'AFTER LUMINANCE\n{ascii_luma(after,width,height)}\n\n'
                  f'BEFORE EDGE MAP\n{ascii_edges(before,width,height)}\n\n'
                  f'AFTER EDGE MAP\n{ascii_edges(after,width,height)}\n'
              )
              (out/f'{view}.txt').write_text(text,encoding='utf-8')

          summary={
              'contract':'CP4R2R1DirectArtAuditExtraction/1',
              'source_candidate_run_id':36997823624,
              'view_count':len(views),
              'same_camera_definition':True,
              'diagnostics':diagnostics,
              'minimum_iou':min(value['iou'] for value in diagnostics.values()),
              'maximum_component_count_after':max(value['components_after']['count'] for value in diagnostics.values()),
              'maximum_second_component_fraction_after':max(value['components_after']['second_fraction'] for value in diagnostics.values()),
              'audit_decision':'PENDING_MODEL_DIRECT_REVIEW',
          }
          (out/'art_shape_diagnostics.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY

      - name: Publish audit extraction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'chatgpt-garment-cad'
          git config user.email 'chatgpt-garment-cad@users.noreply.github.com'
          git add delivery_r1c_cp4_r2_r1_audit
          git commit -m 'Publish CP4-R2-R1 direct art audit extraction [skip ci]'
          git push origin HEAD:garment-cad-pro-r1c-cp4-r2-r1-20261002
