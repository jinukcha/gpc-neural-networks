name: Garment R1C CP4-R2-R1 Visual Audit PDF

on:
  push:
    branches:
      - garment-cad-pro-r1c-cp4-r2-r1-20261002

permissions:
  actions: read
  contents: write

concurrency:
  group: garment-cad-pro-r1c-cp4-r2-r1-audit-pdf
  cancel-in-progress: true

jobs:
  audit_pdf:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: garment-cad-pro-r1c-cp4-r2-r1-20261002
          persist-credentials: true

      - name: Download accepted metric candidate
        uses: actions/download-artifact@v4
        with:
          name: GARMENT_R1C_CP4_R2_R1_CANDIDATE
          path: ${{ runner.temp }}/candidate
          repository: jinukcha/gpc-neural-networks
          run-id: 36997823624
          github-token: ${{ github.token }}

      - name: Build same-camera before-after PDF
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir pillow==11.1.0
          python - "$RUNNER_TEMP/candidate" delivery_r1c_cp4_r2_r1_audit <<'PY'
          from pathlib import Path
          import sys
          from PIL import Image, ImageDraw, ImageOps

          root=Path(sys.argv[1]); out=Path(sys.argv[2]); out.mkdir(parents=True,exist_ok=True)
          before=root/'build/r1c_cp4_r1/visual'
          after=root/'build/r1c_cp4_r2_r1/visual/after'
          views=(
              'front','left','right','back','front_three_quarter','back_three_quarter',
              'garment_only','shoulder_cap_detail','underarm_detail','neck_collar_detail',
              'wireframe_front','seam_notch_overlay',
          )
          pages=[]
          for view in views:
              left=Image.open(before/f'{view}.png').convert('RGB')
              right=Image.open(after/f'{view}.png').convert('RGB')
              left.thumbnail((1200,1200),Image.Resampling.LANCZOS)
              right.thumbnail((1200,1200),Image.Resampling.LANCZOS)
              page=Image.new('RGB',(2480,1320),(24,24,28))
              page.paste(left,(20,100)); page.paste(right,(1260,100))
              draw=ImageDraw.Draw(page)
              draw.text((24,24),f'{view} — CP4-R1 BEFORE',fill=(245,245,245))
              draw.text((1264,24),f'{view} — CP4-R2-R1 AFTER',fill=(245,245,245))
              pages.append(page)
          target=out/'cp4_r2_r1_direct_art_audit.pdf'
          pages[0].save(target,save_all=True,append_images=pages[1:],resolution=150.0)
          PY
          git config user.name 'chatgpt-garment-cad'
          git config user.email 'chatgpt-garment-cad@users.noreply.github.com'
          git add delivery_r1c_cp4_r2_r1_audit/cp4_r2_r1_direct_art_audit.pdf
          git commit -m 'Publish CP4-R2-R1 visual audit PDF [skip ci]'
          git push origin HEAD:garment-cad-pro-r1c-cp4-r2-r1-20261002
