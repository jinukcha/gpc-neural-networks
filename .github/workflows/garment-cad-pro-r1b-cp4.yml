name: Garment CAD Pro R1B CP4

on:
  push:
    branches:
      - garment-cad-pro-r1b-cp4-20261001

permissions:
  actions: read
  contents: write

concurrency:
  group: garment-cad-pro-r1b-cp4-20261001
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: garment-cad-pro-r1b-cp4-20261001
          persist-credentials: true

      - name: Download immutable CP3 integrated predecessor
        uses: actions/download-artifact@v4
        with:
          name: GARMENT_R1B_CP3_FINAL
          path: ${{ runner.temp }}/base
          repository: jinukcha/gpc-neural-networks
          run-id: 36874764717
          github-token: ${{ github.token }}

      - name: Restore CP3 and overlay CP4 kernels
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/work/GARMENT_R1B_CP4_FINAL"
          mkdir -p "$root/source" "$root/scripts" "$root/tests" "$root/godot"
          cp -a "$RUNNER_TEMP/base/." "$root/"
          python - "$RUNNER_TEMP/base" "$RUNNER_TEMP/predecessor.json" <<'PY'
          import hashlib,json,pathlib,sys
          base=pathlib.Path(sys.argv[1]); target=pathlib.Path(sys.argv[2])
          def h(path):
              d=hashlib.sha256()
              for item in sorted(x for x in path.rglob('*') if x.is_file()):
                  if '__pycache__' in item.parts or item.suffix in {'.pyc','.pyo'}: continue
                  d.update(item.relative_to(path).as_posix().encode()); d.update(hashlib.sha256(item.read_bytes()).digest())
              return d.hexdigest()
          roots=('build/rig_cp0','build/rig_cp1','build/rig_cp2','build/rig_cp3','build/garment_cad_pro_cp6_r1')
          payload={'build_roots':{name:h(base/name) for name in roots}}
          payload['source_files']={p.relative_to(base/'source').as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in (base/'source').rglob('*.py') if '__pycache__' not in p.parts}
          target.write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          PY
          cp -a cp4_overlay/source/. "$root/source/"
          cp -a cp4_overlay/scripts/. "$root/scripts/"
          cp -a cp4_overlay/tests/. "$root/tests/"
          cp -a cp4_overlay/godot/. "$root/godot/"
          chmod +x "$root/scripts/"*.py
          echo "ROOT=$root" >> "$GITHUB_ENV"

      - name: Install bounded CP4 tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir \
            numpy==2.5.3 matplotlib==3.9.4 pillow==11.1.0 pytest==8.3.5 jsonschema==4.25.1

      - name: Compile registry, outfit plans, body mask and Python transactions
        shell: bash
        run: |
          set -euo pipefail
          env MPLBACKEND=Agg PYTHONPATH="$ROOT/source" \
            python "$ROOT/scripts/run_garment_r1b_cp4.py" --root "$ROOT"

      - name: Exact Godot 4.7.2 atomic outfit consumer
        shell: bash
        run: |
          set -euo pipefail
          project="$ROOT/build/rig_cp4/godot_product"
          mkdir -p "$project/products" "$project/data"
          cp "$ROOT/godot/garment_r1b_cp4/project.godot" "$project/"
          cp "$ROOT/godot/garment_r1b_cp4/verify_outfit.gd" "$project/"
          python - "$ROOT/build/rig_cp4/garment_library_registry.json" "$ROOT" "$project/products" <<'PY'
          import json,pathlib,shutil,sys
          registry=json.loads(pathlib.Path(sys.argv[1]).read_text()); root=pathlib.Path(sys.argv[2]); out=pathlib.Path(sys.argv[3])
          targets={'SLEEVELESS_TUNIC_RIGGED_R1B':'tunic_rigged.glb','TROUSERS_RIGGED_R1B':'trousers_rigged.glb'}
          found=set()
          for entry in registry['entries']:
              garment_id=entry['garment_id']
              if garment_id in targets:
                  shutil.copy2(root/entry['product_path'],out/targets[garment_id]); found.add(garment_id)
          assert found==set(targets),found
          PY
          cp "$ROOT/build/rig_cp4/outfits/reference_two_piece.json" "$project/data/"
          cp "$ROOT/build/rig_cp4/outfits/incompatible_duplicate_tunic.json" "$project/data/"
          cp "$ROOT/build/rig_cp4/body_occlusion/body_hide_mask.json" "$project/data/"
          godot_dir="$RUNNER_TEMP/godot-4.7.2"; mkdir -p "$godot_dir"
          curl -L --fail --retry 3 \
            -o "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64.zip" \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64.zip" -d "$godot_dir"
          godot="$godot_dir/Godot_v4.7.2-stable_linux.x86_64"; chmod +x "$godot"
          timeout 180 "$godot" --headless --path "$project" --import
          timeout 180 "$godot" --headless --path "$project" --script res://verify_outfit.gd | tee "$RUNNER_TEMP/godot_cp4.log"
          python - "$RUNNER_TEMP/godot_cp4.log" "$RUNNER_TEMP/godot_outfit_receipt.json" <<'PY'
          import json,pathlib,sys
          marker='CP4_GODOT_OUTFIT_RECEIPT='
          rows=[line.split(marker,1)[1] for line in pathlib.Path(sys.argv[1]).read_text(errors='replace').splitlines() if marker in line]
          if not rows: raise SystemExit('missing Godot CP4 receipt')
          payload=json.loads(rows[-1])
          assert payload['consumer_pass'] and payload['read_only_consumer']
          version=payload['godot_version']; assert (int(version['major']),int(version['minor']),int(version['patch']))==(4,7,2)
          pathlib.Path(sys.argv[2]).write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          PY
          env MPLBACKEND=Agg PYTHONPATH="$ROOT/source" \
            python "$ROOT/scripts/finalize_garment_r1b_cp4.py" \
              --root "$ROOT" --godot-receipt "$RUNNER_TEMP/godot_outfit_receipt.json"
          rm -rf "$project/.godot" "$project/products" "$project/data"
          rm -f "$project/project.godot" "$project/verify_outfit.gd"
          rm -f "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64.zip"

      - name: Verify immutable CP0-CP3 owners
        shell: bash
        run: |
          set -euo pipefail
          find "$ROOT/source" -type d -name __pycache__ -prune -exec rm -rf {} +
          find "$ROOT/source" -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          python - "$ROOT" "$RUNNER_TEMP/predecessor.json" <<'PY'
          import hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1]); before=json.loads(pathlib.Path(sys.argv[2]).read_text())
          def h(path):
              d=hashlib.sha256()
              for item in sorted(x for x in path.rglob('*') if x.is_file()):
                  if '__pycache__' in item.parts or item.suffix in {'.pyc','.pyo'}: continue
                  d.update(item.relative_to(path).as_posix().encode()); d.update(hashlib.sha256(item.read_bytes()).digest())
              return d.hexdigest()
          after_roots={name:h(root/name) for name in before['build_roots']}
          source_pass=True; changed=[]
          for rel,expected in before['source_files'].items():
              path=root/'source'/rel
              actual=hashlib.sha256(path.read_bytes()).hexdigest() if path.is_file() else None
              if actual!=expected: source_pass=False; changed.append(rel)
          root_pass=after_roots==before['build_roots']
          payload={'contract':'R1BCP4PredecessorPreservationReceipt/1','build_roots_before':before['build_roots'],'build_roots_after':after_roots,'source_predecessor_pass':source_pass,'changed_source_files':changed,'all_predecessors_unchanged':root_pass and source_pass}
          payload['receipt_sha256']=hashlib.sha256(json.dumps(payload,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          target=root/'build/rig_cp4/predecessor_preservation.json'; target.write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          assert payload['all_predecessors_unchanged'],payload
          PY

      - name: Test, schema-check and validate CP4
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$ROOT/source" pytest -q "$ROOT/tests/test_garment_r1b_cp4.py"
          python - "$ROOT" <<'PY'
          import json,pathlib,sys
          from jsonschema import Draft202012Validator,validate
          root=pathlib.Path(sys.argv[1]); schema_dir=root/'contracts/rig/outfit'
          schemas={p.name:json.loads(p.read_text()) for p in schema_dir.glob('*.schema.json')}
          assert len(schemas)==5
          for schema in schemas.values(): Draft202012Validator.check_schema(schema)
          docs={
            'garment_library_registry.schema.json':root/'build/rig_cp4/garment_library_registry.json',
            'outfit_assembly_plan.schema.json':root/'build/rig_cp4/outfits/reference_two_piece.json',
            'body_occlusion_mask.schema.json':root/'build/rig_cp4/body_occlusion/body_hide_mask.json',
            'outfit_transaction_receipt.schema.json':root/'build/rig_cp4/outfit_transaction_suite.json',
            'outfit_runtime_receipt.schema.json':root/'build/rig_cp4/godot_product/godot_outfit_runtime_receipt.json',
          }
          for name,path in docs.items(): validate(json.loads(path.read_text()),schemas[name])
          PY
          PYTHONPATH="$ROOT/source" python "$ROOT/scripts/validate_garment_r1b_cp4.py" --root "$ROOT"

      - name: Diet and manifest integrated bundle
        shell: bash
        run: |
          set -euo pipefail
          find "$ROOT" -type d \( -name __pycache__ -o -name .pytest_cache -o -name kernel_cache_bin -o -name .godot \) -prune -exec rm -rf {} +
          find "$ROOT" -type f \( -name '*.pyc' -o -name '*.pyo' -o -name '*.blend1' -o -name '*.whl' \) -delete
          python "$ROOT/scripts/write_manifest.py" --root "$ROOT"
          (cd "$ROOT" && sha256sum -c MANIFEST.sha256 >/dev/null)

      - name: Publish CP4 evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf delivery_r1b_cp4; mkdir -p delivery_r1b_cp4
          cp "$ROOT/build/rig_cp4/cp4_outfit_layering_evidence.png" delivery_r1b_cp4/
          cp "$ROOT/build/rig_cp4/cp4_receipt.json" delivery_r1b_cp4/
          cp "$ROOT/build/rig_cp4/garment_library_registry.json" delivery_r1b_cp4/
          cp "$ROOT/build/rig_cp4/outfit_transaction_suite.json" delivery_r1b_cp4/
          cp "$ROOT/build/rig_cp4/body_occlusion/body_hide_mask.json" delivery_r1b_cp4/
          git config user.name 'chatgpt-garment-cad'
          git config user.email 'chatgpt-garment-cad@users.noreply.github.com'
          git add delivery_r1b_cp4
          if ! git diff --cached --quiet; then
            git commit -m 'Publish GARMENT-CAD-PRO-R1B CP4 evidence [skip ci]'
            git push origin HEAD:garment-cad-pro-r1b-cp4-20261001
          fi

      - name: Upload single integrated CP4 bundle
        uses: actions/upload-artifact@v4
        with:
          name: GARMENT_R1B_CP4_FINAL
          path: ${{ env.ROOT }}
          compression-level: 6
          retention-days: 2
          if-no-files-found: error
