name: RCF R0C CP2-A accepted baseline receipt inspection

on:
  push:
    branches: [automation/rcf-r0c-cp2a-freeze-20260926]
    paths: [.github/workflows/rcf-r0c-cp2a-baseline-receipt-inspect.yml]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/rcf-r0c-cp2a-freeze-20260926
          fetch-depth: 0

      - name: Download and inspect accepted fixed-baseline replay artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf baseline_receipt_work cp2a_baseline_receipt
          mkdir -p baseline_receipt_work/extracted cp2a_baseline_receipt
          curl -L --fail --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o baseline_receipt_work/accepted_replay_artifact.zip \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/10888433130/zip"
          echo '17be24bd7c8868e5ba14ea100162b747df5225d3ec7145b2324ebef49ee4d2cb  baseline_receipt_work/accepted_replay_artifact.zip' | sha256sum -c -
          unzip -t baseline_receipt_work/accepted_replay_artifact.zip
          unzip -q baseline_receipt_work/accepted_replay_artifact.zip -d baseline_receipt_work/extracted
          find baseline_receipt_work/extracted -type f -printf '%P\n' | sort | tee cp2a_baseline_receipt/CONTENTS.txt
          test -s cp2a_baseline_receipt/CONTENTS.txt
          cp -a baseline_receipt_work/extracted/. cp2a_baseline_receipt/
          python - <<'PY'
          from pathlib import Path
          import hashlib, json

          root = Path('cp2a_baseline_receipt')
          records = []
          parsed = []
          for src in sorted(p for p in root.rglob('*') if p.is_file() and p.name not in {'CONTENTS.txt', 'INSPECTION.json'}):
              record = {
                  'path': src.relative_to(root).as_posix(),
                  'bytes': src.stat().st_size,
                  'sha256': hashlib.sha256(src.read_bytes()).hexdigest(),
              }
              if src.suffix.lower() == '.json':
                  data = json.loads(src.read_text(encoding='utf-8'))
                  record['json'] = data
                  parsed.append(data)
              records.append(record)

          expected = {
              'baseline_sha256': '6b705952be72036e9d6c6eaa614ddd33abe963ed9d1411f9d839b1f11e7f1cd2',
              'patch_sha256': 'dddb960aa467689eecf1e312724ce06c0c9175e0fdc902c534c4e12ffdca77b4',
              'target_sha256': '91cf2025f311772b0a137d3509efa0b1d65b96832a78f1e4f46ba9cf3b06e878',
          }
          serialized = json.dumps(parsed, sort_keys=True)
          for key, value in expected.items():
              if value not in serialized:
                  raise SystemExit(f'accepted replay receipt does not contain {key}={value}')
          pass_tokens = ('PASS', 'true')
          if not any(token in serialized for token in pass_tokens):
              raise SystemExit('accepted replay receipt contains no PASS/true result')

          result = {
              'schema': 'royal-capital.fortification.r0c-cp2.cp2a-baseline-receipt-inspection/1',
              'status': 'PASS',
              'accepted_workflow_run_id': 36192768002,
              'accepted_artifact_id': 10888433130,
              'accepted_artifact_sha256': '17be24bd7c8868e5ba14ea100162b747df5225d3ec7145b2324ebef49ee4d2cb',
              'authority': expected,
              'records': records,
              'failed_predecessor_preserved': 36212994542,
          }
          (root / 'INSPECTION.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Commit accepted replay receipt snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cp2a_baseline_receipt
          git commit -m 'Record accepted C1 fixed-baseline replay receipt'
          git push origin HEAD:automation/rcf-r0c-cp2a-freeze-20260926

      - uses: actions/upload-artifact@v4
        with:
          name: rcf-r0c-cp2a-baseline-receipt
          path: cp2a_baseline_receipt
          retention-days: 7
