name: Garment CAD Pro R1A CP6-R1 Final

on:
  push:
    branches:
      - garment-cad-pro-r1a-cp6-r1-20261001

permissions:
  actions: read
  contents: write

concurrency:
  group: garment-cad-pro-r1a-cp6-r1-final
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: garment-cad-pro-r1a-cp6-r1-20261001
          persist-credentials: true

      - name: Download immutable CP6 integrated predecessor
        uses: actions/download-artifact@v4
        with:
          name: WG_OSS_R0A_GARMENT_CAD_PRO_R1A_CP6_FINAL
          path: ${{ runner.temp }}/base
          repository: jinukcha/gpc-neural-networks
          run-id: 36848757183
          github-token: ${{ github.token }}

      - name: Restore CP6-R1 checkpoint and snapshot predecessors
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/work/WG_OSS_R0A_GARMENT_CAD_PRO_R1A_CP6_R1_FINAL"
          mkdir -p "$root/source" "$root/scripts" "$root/tests" "$root/godot"
          cp -a "$RUNNER_TEMP/base/." "$root/"
          cat cp6_r1_overlay_chunks/part*.b64 | base64 --decode > "$RUNNER_TEMP/cp6_r1_overlay.tar.gz"
          echo "73f802852c86d9202ab115fc180b0e93507ed6e5adaa9eed13690d63b726b172  $RUNNER_TEMP/cp6_r1_overlay.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/cp6_r1_overlay"
          tar -xzf "$RUNNER_TEMP/cp6_r1_overlay.tar.gz" -C "$RUNNER_TEMP/cp6_r1_overlay"
          python - "$root" "$RUNNER_TEMP/predecessor_hashes.json" <<'PY'
          import hashlib, json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          output = pathlib.Path(sys.argv[2])
          paths = (
              'build/pattern_cad_cp1',
              'build/pattern_cad_cp2',
              'build/construction_cp3',
              'build/material_calibration_cp4',
              'build/motion_fit_cp5',
              'build/motion_fit_cp5_r1',
              'build/motion_fit_cp5_r1_closeout',
              'build/garment_cad_pro_cp6',
              'build/tunic_pilot',
              'source/wuxia_garment_oss/pattern_cad',
              'source/wuxia_garment_oss/construction',
              'source/wuxia_garment_oss/materials',
              'source/wuxia_garment_oss/qualification',
              'source/wuxia_garment_oss/sizing',
              'source/wuxia_garment_oss/garments/trousers',
              'source/wuxia_garment_oss/garments/sleeveless_tunic/construction',
              'source/wuxia_garment_oss/garments/sleeveless_tunic/geometry',
              'source/wuxia_garment_oss/garments/sleeveless_tunic/pattern',
              'source/wuxia_garment_oss/garments/sleeveless_tunic/pattern_cad',
              'source/wuxia_garment_oss/garments/sleeveless_tunic/reference.py',
              'source/wuxia_garment_oss/garments/sleeveless_tunic/resolver.py',
          )
          def path_hash(path):
              digest = hashlib.sha256()
              if path.is_file():
                  digest.update(path.name.encode())
                  digest.update(hashlib.sha256(path.read_bytes()).digest())
                  return digest.hexdigest()
              for item in sorted(x for x in path.rglob('*') if x.is_file()):
                  digest.update(item.relative_to(path).as_posix().encode())
                  digest.update(hashlib.sha256(item.read_bytes()).digest())
              return digest.hexdigest()
          payload = {name: path_hash(root / name) for name in paths}
          output.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          PY
          cp -a "$RUNNER_TEMP/cp6_r1_overlay/source/." "$root/source/"
          cp -a "$RUNNER_TEMP/cp6_r1_overlay/scripts/." "$root/scripts/"
          cp -a "$RUNNER_TEMP/cp6_r1_overlay/tests/." "$root/tests/"
          cp -a "$RUNNER_TEMP/cp6_r1_overlay/godot/." "$root/godot/"
          chmod +x "$root/scripts/"*.py
          echo "ROOT=$root" >> "$GITHUB_ENV"

      - name: Install exact Warp and bounded CP6-R1 tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir \
            numpy==2.5.3 matplotlib==3.9.4 pillow==11.1.0 pytest==8.3.5 jsonschema==4.25.1
          wheel_dir="$RUNNER_TEMP/warp-wheel"
          mkdir -p "$wheel_dir"
          python -m pip download --disable-pip-version-check --no-cache-dir --no-deps \
            --only-binary=:all: warp-lang==1.17.0 -d "$wheel_dir"
          wheel="$(find "$wheel_dir" -type f -name 'warp_lang-1.17.0-*.whl' | head -1)"
          test -n "$wheel"
          echo "47cd93636828dd16e55eeb4e77a0e3547b5fb0f383000a3d228629df68f28fd8  $wheel" | sha256sum -c -
          python -m pip install --disable-pip-version-check --no-cache-dir --no-deps "$wheel"

      - name: Build feature-complete topology and run 30 motion scenarios
        shell: bash
        run: |
          set -euo pipefail
          env MPLBACKEND=Agg WARP_CACHE_PATH="$RUNNER_TEMP/warp-cache" PYTHONPATH="$ROOT/source:$ROOT/scripts" \
            python "$ROOT/scripts/run_garment_cad_pro_cp6_r1.py" --root "$ROOT"

      - name: Fresh-process GLB product parity
        shell: bash
        run: |
          set -euo pipefail
          env PYTHONPATH="$ROOT/source" \
            python "$ROOT/scripts/verify_garment_cad_pro_cp6_r1_glb.py" --root "$ROOT"

      - name: Exact Godot 4.7.2 read-only consumer
        shell: bash
        run: |
          set -euo pipefail
          godot_dir="$RUNNER_TEMP/godot-4.7.2"
          project="$ROOT/build/garment_cad_pro_cp6_r1/godot_product"
          mkdir -p "$godot_dir" "$project/products"
          curl -L --fail --retry 3 \
            -o "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64.zip" \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64.zip" -d "$godot_dir"
          godot="$godot_dir/Godot_v4.7.2-stable_linux.x86_64"
          chmod +x "$godot"
          cp "$ROOT/godot/garment_cad_pro_cp6_r1/project.godot" "$project/"
          cp "$ROOT/godot/garment_cad_pro_cp6_r1/verify_import.gd" "$project/"
          cp "$ROOT/build/garment_cad_pro_cp6_r1/game_products/feature_complete_tunic.glb" "$project/products/"
          cp "$ROOT/build/garment_cad_pro_cp6/game_products/trousers.glb" "$project/products/"
          timeout 180 "$godot" --headless --path "$project" --import
          timeout 180 "$godot" --headless --path "$project" --script res://verify_import.gd | tee "$RUNNER_TEMP/godot_consumer.log"
          python - "$RUNNER_TEMP/godot_consumer.log" "$project/godot_consumer_receipt.json" <<'PY'
          import json, pathlib, sys
          lines = pathlib.Path(sys.argv[1]).read_text(errors='replace').splitlines()
          marker = 'CP6_R1_GODOT_RECEIPT='
          matches = [line.split(marker, 1)[1] for line in lines if marker in line]
          if not matches:
              raise SystemExit('missing CP6_R1_GODOT_RECEIPT')
          payload = json.loads(matches[-1])
          version = payload['godot_version']
          assert int(version['major']) == 4 and int(version['minor']) == 7 and int(version['patch']) == 2
          assert payload['read_only_consumer'] is True
          assert payload['consumer_pass'] is True
          pathlib.Path(sys.argv[2]).write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          PY
          rm -rf "$project/.godot" "$project/products"
          rm -f "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64.zip"

      - name: Verify immutable predecessors
        shell: bash
        run: |
          set -euo pipefail
          python - "$ROOT" "$RUNNER_TEMP/predecessor_hashes.json" <<'PY'
          import hashlib, json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          before = json.loads(pathlib.Path(sys.argv[2]).read_text())
          def path_hash(path):
              digest = hashlib.sha256()
              if path.is_file():
                  digest.update(path.name.encode())
                  digest.update(hashlib.sha256(path.read_bytes()).digest())
                  return digest.hexdigest()
              for item in sorted(x for x in path.rglob('*') if x.is_file()):
                  digest.update(item.relative_to(path).as_posix().encode())
                  digest.update(hashlib.sha256(item.read_bytes()).digest())
              return digest.hexdigest()
          after = {name: path_hash(root / name) for name in before}
          unchanged = {name: before[name] == after[name] for name in before}
          payload = {
              'contract': 'CP6R1PredecessorPreservationReceipt/1',
              'before': before,
              'after': after,
              'unchanged': unchanged,
              'all_predecessors_unchanged': all(unchanged.values()),
          }
          canonical = json.dumps(payload, sort_keys=True, separators=(',', ':')).encode()
          payload['receipt_sha256'] = hashlib.sha256(canonical).hexdigest()
          target = root / 'build/garment_cad_pro_cp6_r1/predecessor_preservation.json'
          target.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          assert payload['all_predecessors_unchanged'], [k for k,v in unchanged.items() if not v]
          PY

      - name: Finalize R1A program closeout
        shell: bash
        run: |
          set -euo pipefail
          env PYTHONPATH="$ROOT/source" \
            python "$ROOT/scripts/finalize_garment_cad_pro_cp6_r1.py" --root "$ROOT"

      - name: Test CP6-R1 and validate source budget
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$ROOT/source" pytest -q "$ROOT/tests/test_garment_cad_pro_cp6_r1.py"
          python - "$ROOT" <<'PY'
          import ast, json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          files = sorted((root / 'source').rglob('*.py')) + sorted((root / 'scripts').glob('*.py'))
          maximum_file = ('', 0)
          maximum_function = ('', '', 0)
          violations = []
          for path in files:
              text = path.read_text()
              relative = path.relative_to(root).as_posix()
              loc = len(text.splitlines())
              if loc > maximum_file[1]: maximum_file = (relative, loc)
              if loc > 500: violations.append(('file', relative, loc))
              tree = ast.parse(text)
              for node in ast.walk(tree):
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      size = getattr(node, 'end_lineno', node.lineno) - node.lineno + 1
                      if size > maximum_function[2]: maximum_function = (relative, node.name, size)
                      if size > 80: violations.append(('function', relative, node.name, size))
          assert not violations, violations
          checks = {
              'cp6_r1_tests': 'PASS',
              'files_checked': len(files),
              'maximum_file': maximum_file,
              'maximum_function': maximum_function,
              'files_over_500': [],
              'functions_over_80': [],
          }
          (root / 'PROFESSIONAL_CHECKS.json').write_text(json.dumps(checks, indent=2, sort_keys=True) + '\n')
          print(json.dumps(checks, sort_keys=True))
          PY

      - name: Diet and manifest final integrated bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ROOT/godot"
          find "$ROOT" -type d \( -name __pycache__ -o -name .pytest_cache -o -name kernel_cache_bin -o -name .godot \) -prune -exec rm -rf {} +
          find "$ROOT" -type f \( -name '*.pyc' -o -name '*.pyo' -o -name '*.blend1' -o -name '*.whl' \) -delete
          python "$ROOT/scripts/write_manifest.py" --root "$ROOT"
          (cd "$ROOT" && sha256sum -c MANIFEST.sha256 >/dev/null)

      - name: Publish CP6-R1 evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf delivery_pro_cp6_r1
          mkdir -p delivery_pro_cp6_r1
          cp "$ROOT/build/garment_cad_pro_cp6_r1/cp6_r1_feature_topology_evidence.png" delivery_pro_cp6_r1/
          cp "$ROOT/build/garment_cad_pro_cp6_r1/cp6_r1_ten_pose_product_evidence.png" delivery_pro_cp6_r1/
          cp "$ROOT/build/garment_cad_pro_cp6_r1/cp6_r1_motion_qualification_evidence.png" delivery_pro_cp6_r1/
          cp "$ROOT/build/garment_cad_pro_cp6_r1/cp6_r1_receipt.json" delivery_pro_cp6_r1/
          cp "$ROOT/build/garment_cad_pro_cp6_r1/predecessor_preservation.json" delivery_pro_cp6_r1/
          git config user.name 'chatgpt-garment-cad'
          git config user.email 'chatgpt-garment-cad@users.noreply.github.com'
          git add delivery_pro_cp6_r1
          if ! git diff --cached --quiet; then
            git commit -m 'Publish garment CAD Pro CP6-R1 evidence [skip ci]'
            git push origin HEAD:garment-cad-pro-r1a-cp6-r1-20261001
          fi

      - name: Upload single integrated CP6-R1 bundle
        uses: actions/upload-artifact@v4
        with:
          name: WG_OSS_R0A_GARMENT_CAD_PRO_R1A_CP6_R1_FINAL
          path: ${{ env.ROOT }}
          compression-level: 6
          retention-days: 2
          if-no-files-found: error
