name: Garment CAD Pro R1A CP1 recovery

on:
  push:
    branches:
      - garment-cad-pro-r1a-cp1-recovery-20261001

permissions:
  contents: write
  actions: read

concurrency:
  group: garment-cad-pro-r1a-cp1-recovery-20261001
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: garment-cad-pro-r1a-cp1-recovery-20261001
          persist-credentials: true

      - name: Download preserved CP3 sizing baseline
        uses: actions/download-artifact@v4
        with:
          name: WG_OSS_R0A_CP2B_R4_REV1_GARMENT_SIZING_CP3
          path: ${{ runner.temp }}/base
          repository: jinukcha/gpc-neural-networks
          run-id: 36801050053
          github-token: ${{ github.token }}

      - name: Overlay CP1 professional kernels and preserve predecessor owners
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/work/WG_OSS_R0A_GARMENT_CAD_PRO_R1A_CP1_RECOVERY"
          mkdir -p "$root/source" "$root/scripts" "$root/tests" "$root/docs"
          cp -a "$RUNNER_TEMP/base/." "$root/"
          hash_tree() {
            find "$1" -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}'
          }
          base_sizing="$(hash_tree "$root/source/wuxia_garment_oss/sizing")"
          base_drape="$(hash_tree "$root/source/wuxia_garment_oss/drape")"
          base_tunic_build="$(hash_tree "$root/build/tunic_pilot")"
          cp -a cp1_pro_overlay/source/. "$root/source/"
          cp -a cp1_pro_overlay/scripts/. "$root/scripts/"
          cp -a cp1_pro_overlay/tests/. "$root/tests/"
          cp -a cp1_pro_overlay/docs/. "$root/docs/"
          chmod +x "$root/scripts/"*.py
          after_sizing="$(hash_tree "$root/source/wuxia_garment_oss/sizing")"
          after_drape="$(hash_tree "$root/source/wuxia_garment_oss/drape")"
          after_tunic_build="$(hash_tree "$root/build/tunic_pilot")"
          test "$base_sizing" = "$after_sizing"
          test "$base_drape" = "$after_drape"
          test "$base_tunic_build" = "$after_tunic_build"
          echo "ROOT=$root" >> "$GITHUB_ENV"
          echo "BASE_SIZING_HASH=$base_sizing" >> "$GITHUB_ENV"
          echo "AFTER_SIZING_HASH=$after_sizing" >> "$GITHUB_ENV"
          echo "BASE_DRAPE_HASH=$base_drape" >> "$GITHUB_ENV"
          echo "AFTER_DRAPE_HASH=$after_drape" >> "$GITHUB_ENV"
          echo "BASE_TUNIC_BUILD_HASH=$base_tunic_build" >> "$GITHUB_ENV"
          echo "AFTER_TUNIC_BUILD_HASH=$after_tunic_build" >> "$GITHUB_ENV"

      - name: Install bounded CP1 tooling
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          numpy==2.1.3 matplotlib==3.9.4 pillow==11.1.0
          pytest==8.3.5 jsonschema==4.25.1

      - name: Execute PatternDocument migration and transaction pilot
        run: >-
          env MPLBACKEND=Agg PYTHONPATH="$ROOT/source"
          python "$ROOT/scripts/run_garment_cad_pro_cp1.py" --root "$ROOT"

      - name: Test sizing regression and CP1 pattern CAD
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$ROOT/source" pytest -q \
            "$ROOT/tests/test_garment_sizing_cp1.py" \
            "$ROOT/tests/test_garment_sizing_cp2.py" \
            "$ROOT/tests/test_garment_sizing_cp3.py" \
            "$ROOT/tests/test_garment_cad_pro_cp1.py"

      - name: Validate CP1 outputs and source budget
        run: python "$ROOT/scripts/validate_garment_cad_pro_cp1.py" --root "$ROOT"

      - name: Validate schemas and diet bundle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib
          from jsonschema import Draft202012Validator
          root = pathlib.Path(os.environ['ROOT'])
          schemas = sorted((root / 'contracts/professional').glob('*.schema.json'))
          assert len(schemas) == 3
          for path in schemas:
              Draft202012Validator.check_schema(json.loads(path.read_text()))
          PY
          find "$ROOT" -type d \( -name __pycache__ -o -name .pytest_cache \) -prune -exec rm -rf {} +
          find "$ROOT" -type f \( -name '*.pyc' -o -name '*.pyo' -o -name '*.blend1' -o -name '*.whl' \) -delete
          python "$ROOT/scripts/write_manifest.py" --root "$ROOT"
          (cd "$ROOT" && sha256sum -c MANIFEST.sha256)

      - name: Publish CP1 execution evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf delivery_pro_cp1
          mkdir -p delivery_pro_cp1
          cp "$ROOT/build/pattern_cad_cp1/cp1_pattern_document_evidence.png" delivery_pro_cp1/
          cp "$ROOT/build/pattern_cad_cp1/cp1_receipt.json" delivery_pro_cp1/
          cp "$ROOT/build/pattern_cad_cp1/transaction_receipt.json" delivery_pro_cp1/
          cp "$ROOT/PROFESSIONAL_STATUS.json" delivery_pro_cp1/
          cp "$ROOT/PROFESSIONAL_CHECKS.json" delivery_pro_cp1/
          git config user.name 'chatgpt-garment-cad'
          git config user.email 'chatgpt-garment-cad@users.noreply.github.com'
          git add delivery_pro_cp1
          if ! git diff --cached --quiet; then
            git commit -m 'Publish GARMENT-CAD-PRO CP1 evidence [skip ci]'
            git push origin HEAD:garment-cad-pro-r1a-cp1-recovery-20261001
          fi

      - name: Upload single integrated CP1 bundle
        uses: actions/upload-artifact@v4
        with:
          name: WG_OSS_R0A_GARMENT_CAD_PRO_R1A_CP1_RECOVERY
          path: ${{ env.ROOT }}
          compression-level: 6
          retention-days: 2
          if-no-files-found: error
