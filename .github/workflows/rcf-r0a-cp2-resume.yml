name: RCF R0A CP2 resume

on:
  push:
    branches:
      - automation/rcf-cp0-delivery-20260925
    paths:
      - .github/workflows/rcf-r0a-cp2-resume.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  cp2-resume:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up exact CPython 3.13.5
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'

      - name: Download exact 58-wheel CP0 artifact
        uses: actions/download-artifact@v4
        with:
          name: rcf-cp0-cp313-linux-wheelhouse-58
          path: inputs/wheel_artifact
          repository: jinukcha/gpc-neural-networks
          run-id: 36093161115
          github-token: ${{ github.token }}

      - name: Download and verify immutable inputs
        shell: bash
        env:
          RCK0_URL: "https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-bd28-8211-82d3-935be5058325/raw?se=2026-09-25T06%3A33%3A18Z&sp=r&sv=2026-02-06&sr=b&scid=83756ea1-c961-5b25-b159-2e2052a85dd9&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T23%3A45%3A46Z&ske=2026-09-25T23%3A45%3A46Z&sks=b&skv=2026-02-06&sig=yU8ul7wuq9t2pUdPuqepvlYf/O6UG3nceR3Bt80F5Hc%3D"
          D0P_URL: "https://sdmntprwestus.oaiusercontent.com/files/00000000-2d14-8230-9aa5-072a9a526af4/raw?se=2026-09-25T06%3A33%3A39Z&sp=r&sv=2026-02-06&sr=b&scid=7f7ee76f-49c1-500c-9604-29d37a01a352&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-25T05%3A25%3A24Z&ske=2026-09-26T05%3A25%3A24Z&sks=b&skv=2026-02-06&sig=FWoe/g5En7T%2Bhz60GvrGLkgKcfY%2Bis6qsVvtsa%2BmXyM%3D"
          A1S_URL: "https://sdmntprcentralus.oaiusercontent.com/files/00000000-0860-81f5-bf91-807f25f18f77/raw?se=2026-09-25T06%3A33%3A50Z&sp=r&sv=2026-02-06&sr=b&scid=360cce72-267b-553f-b799-65fce4364629&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-25T02%3A20%3A35Z&ske=2026-09-26T02%3A20%3A35Z&sks=b&skv=2026-02-06&sig=VWebH/7EqoRX6so9UdYUMnWBuTZsZxt8mgi4s3ePX7U%3D"
        run: |
          set -euo pipefail
          mkdir -p inputs/files
          curl --fail --location --retry 3 "$RCK0_URL" -o inputs/files/RC_K0.zip
          curl --fail --location --retry 3 "$D0P_URL" -o inputs/files/RCF_D0_patch.zip
          curl --fail --location --retry 3 "$A1S_URL" -o inputs/files/A1S.zip
          echo "7f637daf8e6fd1e055cca31e4d287072cc96ae0bb4028121c5471d34905a38ac  inputs/files/RC_K0.zip" | sha256sum -c -
          echo "15369b830e049937e0d980100197c617285687316bea96339b1ed5dc4cb7c47b  inputs/files/RCF_D0_patch.zip" | sha256sum -c -
          echo "56d573c5c82bd421a423f82d251e42553298eccb9bae35a7c95278c209ce8b9d  inputs/files/A1S.zip" | sha256sum -c -

      - name: Restore A1 evidence, checkpoint, qualify, clean generated caches and package CP2
        id: build
        shell: bash
        run: |
          set +e
          python rcf_cp2/rcf_cp2_resume.py \
            --inputs inputs/files \
            --wheel-artifact inputs/wheel_artifact \
            --work work/cp2-resume \
            --packages deliver \
            2>&1 | tee cp2-resume-build.log
          code=${PIPESTATUS[0]}
          echo "$code" > CP2_RESUME_EXIT_CODE.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Preserve resume checkpoint and logs as release assets
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: rcf-r0a-cp2-20260925-r4
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "RCF R0A CP2 resume R4" --notes "Resume after preserving three bounded failures. Regenerate only deterministic CP1 stored copies, remove generated Python caches before immutable registry checks and after CP2 validation, then verify cumulative packaging."
          fi
          files=(deliver/A2_pre.zip deliver/A2_preP.zip deliver/A2_preS.zip deliver/A2_pre_check.json cp2-resume-build.log CP2_RESUME_EXIT_CODE.txt)
          existing=()
          for f in "${files[@]}"; do [[ -f "$f" ]] && existing+=("$f"); done
          ((${#existing[@]})) && gh release upload "$TAG" "${existing[@]}" --clobber

      - name: Upload final release assets
        if: steps.build.outputs.exit_code == '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: rcf-r0a-cp2-20260925-r4
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            deliver/A2.zip deliver/A2P.zip deliver/A2S.zip \
            deliver/A2.md deliver/A2.json deliver/A2.txt deliver/A2.sha256 \
            --clobber

      - name: Upload concise receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rcf-r0a-cp2-resume-r4-receipts
          path: |
            CP2_RESUME_EXIT_CODE.txt
            cp2-resume-build.log
            deliver/A2.md
            deliver/A2.json
            deliver/A2.txt
            deliver/A2.sha256
            deliver/A2_pre_check.json
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce CP2 result
        shell: bash
        run: |
          test "$(cat CP2_RESUME_EXIT_CODE.txt)" = "0"
