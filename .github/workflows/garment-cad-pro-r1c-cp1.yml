name: Garment CAD Pro R1C CP1

on:
  push:
    branches:
      - garment-cad-pro-r1c-cp1-20261002

permissions:
  actions: read
  contents: write

concurrency:
  group: garment-cad-pro-r1c-cp1-20261002
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: garment-cad-pro-r1c-cp1-20261002
          persist-credentials: true

      - name: Download immutable R1C CP0 predecessor
        uses: actions/download-artifact@v4
        with:
          name: GARMENT_R1C_CP0_FINAL
          path: ${{ runner.temp }}/base
          repository: jinukcha/gpc-neural-networks
          run-id: 36962431234
          github-token: ${{ github.token }}

      - name: Restore CP0 and overlay CP1 parameter kernel
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/work/GARMENT_R1C_CP1_FINAL"
          mkdir -p "$root/source" "$root/scripts" "$root/tests" "$root/docs"
          cp -a "$RUNNER_TEMP/base/." "$root/"
          python - "$RUNNER_TEMP/base" "$RUNNER_TEMP/predecessor.json" <<'PY'
          import hashlib,json,pathlib,sys
          base=pathlib.Path(sys.argv[1]); target=pathlib.Path(sys.argv[2])
          def tree_hash(path):
              digest=hashlib.sha256()
              for item in sorted(x for x in path.rglob('*') if x.is_file()):
                  if '__pycache__' in item.parts or item.suffix in {'.pyc','.pyo'}: continue
                  digest.update(item.relative_to(path).as_posix().encode())
                  digest.update(hashlib.sha256(item.read_bytes()).digest())
              return digest.hexdigest()
          roots=tuple(f'build/rig_cp{index}' for index in range(7)) + ('build/r1c_cp0',)
          payload={'build_roots':{name:tree_hash(base/name) for name in roots}}
          payload['source_files']={
              path.relative_to(base/'source').as_posix():hashlib.sha256(path.read_bytes()).hexdigest()
              for path in (base/'source').rglob('*')
              if path.is_file() and '__pycache__' not in path.parts and path.suffix in {'.py','.gd'}
          }
          target.write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          PY
          cp -a r1c_cp1_overlay/source/. "$root/source/"
          cp -a r1c_cp1_overlay/scripts/. "$root/scripts/"
          cp -a r1c_cp1_overlay/tests/. "$root/tests/"
          cp -a r1c_cp1_overlay/docs/. "$root/docs/"
          chmod +x "$root/scripts/"*r1c_cp1.py
          echo "ROOT=$root" >> "$GITHUB_ENV"

      - name: Install bounded CP1 tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir \
            matplotlib==3.9.4 pillow==11.1.0 pytest==8.3.5 jsonschema==4.25.1

      - name: Build canonical and rejection parameter products
        shell: bash
        run: |
          set -euo pipefail
          env MPLBACKEND=Agg PYTHONPATH="$ROOT/source" \
            python "$ROOT/scripts/run_garment_r1c_cp1.py" --root "$ROOT"

      - name: Fresh-process reopen and deterministic rerun
        shell: bash
        run: |
          set -euo pipefail
          env MPLBACKEND=Agg PYTHONPATH="$ROOT/source" \
            python "$ROOT/scripts/verify_garment_r1c_cp1.py" --root "$ROOT"

      - name: Test CP1 parameter engine
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$ROOT/source" pytest -q "$ROOT/tests/test_garment_r1c_cp1.py"
          python - "$ROOT" <<'PY'
          import json,pathlib,sys
          from jsonschema import Draft202012Validator
          root=pathlib.Path(sys.argv[1])
          paths=sorted((root/'contracts/r1c_cp1').glob('*.schema.json'))
          assert len(paths)==5
          for path in paths:
              Draft202012Validator.check_schema(json.loads(path.read_text()))
          print({'schemas':len(paths),'status':'PASS'})
          PY

      - name: Verify immutable R1B and R1C CP0 owners
        shell: bash
        run: |
          set -euo pipefail
          find "$ROOT/source" -type d -name __pycache__ -prune -exec rm -rf {} +
          find "$ROOT/source" -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          python - "$ROOT" "$RUNNER_TEMP/predecessor.json" <<'PY'
          import hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1]); before=json.loads(pathlib.Path(sys.argv[2]).read_text())
          def tree_hash(path):
              digest=hashlib.sha256()
              for item in sorted(x for x in path.rglob('*') if x.is_file()):
                  if '__pycache__' in item.parts or item.suffix in {'.pyc','.pyo'}: continue
                  digest.update(item.relative_to(path).as_posix().encode())
                  digest.update(hashlib.sha256(item.read_bytes()).digest())
              return digest.hexdigest()
          after={name:tree_hash(root/name) for name in before['build_roots']}
          changed=[]
          for rel,expected in before['source_files'].items():
              path=root/'source'/rel
              actual=hashlib.sha256(path.read_bytes()).hexdigest() if path.is_file() else None
              if actual!=expected: changed.append(rel)
          payload={
              'contract':'R1CCP1PredecessorPreservationReceipt/1',
              'build_roots_before':before['build_roots'],
              'build_roots_after':after,
              'changed_predecessor_source_files':changed,
              'all_predecessors_unchanged':after==before['build_roots'] and not changed,
          }
          payload['receipt_sha256']=hashlib.sha256(json.dumps(payload,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          target=root/'build/r1c_cp1/predecessor_preservation.json'
          target.write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          assert payload['all_predecessors_unchanged'],payload
          PY

      - name: Validate terminal CP1 products
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$ROOT/source" python "$ROOT/scripts/validate_garment_r1c_cp1.py" --root "$ROOT"

      - name: Diet and manifest integrated bundle
        shell: bash
        run: |
          set -euo pipefail
          find "$ROOT" -type d \( -name __pycache__ -o -name .pytest_cache -o -name kernel_cache_bin -o -name .godot \) -prune -exec rm -rf {} +
          find "$ROOT" -type f \( -name '*.pyc' -o -name '*.pyo' -o -name '*.blend1' -o -name '*.whl' \) -delete
          python "$ROOT/scripts/write_manifest.py" --root "$ROOT"
          (cd "$ROOT" && sha256sum -c MANIFEST.sha256 >/dev/null)

      - name: Publish CP1 evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf delivery_r1c_cp1
          mkdir -p delivery_r1c_cp1/rejections
          cp "$ROOT/build/r1c_cp1/cp1_ratio_parameter_evidence.png" delivery_r1c_cp1/
          cp "$ROOT/build/r1c_cp1/cp1_receipt.json" delivery_r1c_cp1/
          cp "$ROOT/build/r1c_cp1/resolved_parameter_set.json" delivery_r1c_cp1/
          cp "$ROOT/build/r1c_cp1/parameter_resolution_receipt.json" delivery_r1c_cp1/
          cp "$ROOT/build/r1c_cp1/fresh_process_reopen_receipt.json" delivery_r1c_cp1/
          cp "$ROOT/build/r1c_cp1/rejections/"*.json delivery_r1c_cp1/rejections/
          cp "$ROOT/R1C_CHECKS.json" delivery_r1c_cp1/
          git config user.name 'chatgpt-garment-cad'
          git config user.email 'chatgpt-garment-cad@users.noreply.github.com'
          git add delivery_r1c_cp1
          if ! git diff --cached --quiet; then
            git commit -m 'Publish GARMENT-CAD-PRO-R1C CP1 evidence [skip ci]'
            git push origin HEAD:garment-cad-pro-r1c-cp1-20261002
          fi

      - name: Upload single integrated CP1 bundle
        uses: actions/upload-artifact@v4
        with:
          name: GARMENT_R1C_CP1_FINAL
          path: ${{ env.ROOT }}
          compression-level: 6
          retention-days: 2
          if-no-files-found: error
