name: Garment sizing design package

on:
  push:
    branches:
      - garment-sizing-r0a-design-20260930

permissions:
  contents: read
  actions: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: garment-sizing-r0a-design-20260930
          persist-credentials: false

      - name: Download accepted CP3 recovery bundle
        uses: actions/download-artifact@v4
        with:
          name: WG_OSS_R0A_CP2B_R4_REV1_CP3_RECOVERY
          path: ${{ runner.temp }}/base
          repository: jinukcha/gpc-neural-networks
          run-id: 36702038541
          github-token: ${{ github.token }}

      - name: Overlay sizing design authority without changing product source
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/work/WG_OSS_R0A_CP2B_R4_REV1_CP3_SIZING_DESIGN"
          mkdir -p "$root"
          cp -a "$RUNNER_TEMP/base/." "$root/"
          test -f "$root/build/tunic_pilot/warp_cp3/final_simulation_mesh.npz"
          test -f "$root/build/tunic_pilot/warp_cp3/cp3_frame180_evidence.png"
          test -d "$root/source"

          before_source="$(find "$root/source" -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          before_mesh="$(sha256sum "$root/build/tunic_pilot/warp_cp3/final_simulation_mesh.npz" | awk '{print $1}')"
          before_png="$(sha256sum "$root/build/tunic_pilot/warp_cp3/cp3_frame180_evidence.png" | awk '{print $1}')"
          before_receipt="$(sha256sum "$root/build/tunic_pilot/warp_cp3/cp3_receipt.json" | awk '{print $1}')"

          mkdir -p "$root/docs/architecture" "$root/docs/roadmap" "$root/docs/cp2b"
          cp cp1_product/docs/architecture/CP2B_WARP_BACKEND_DESIGN_KO.md "$root/docs/architecture/"
          cp cp1_product/docs/architecture/GARMENT_SIZING_SYSTEM_KO.md "$root/docs/architecture/"
          cp cp1_product/docs/roadmap/GARMENT_SIZING_R0A_ROADMAP_KO.md "$root/docs/roadmap/"
          cp cp1_product/docs/cp2b/GARMENT_SIZING_DESIGN_REVISION_KO.md "$root/docs/cp2b/"
          cp cp1_product/NEXT_TASK.md "$root/NEXT_TASK.md"

          ROOT="$root" SOURCE_HASH="$before_source" MESH_HASH="$before_mesh" PNG_HASH="$before_png" RECEIPT_HASH="$before_receipt" python - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['ROOT'])
          payload = {
              'schema_version': 1,
              'revision': 'GARMENT-SIZING-R0A-DESIGN',
              'scope': 'DESIGN_AND_ROADMAP_ONLY',
              'all_apparel_required': True,
              'sizing_modes': ['STANDARD_SIZE', 'AUTO_BODY_FIT', 'CUSTOM_MEASUREMENTS'],
              'size_table_cardinality': 'ARBITRARY_N',
              'reference_cp2b_preserved': True,
              'cp3_product_result_preserved': True,
              'product_technical_pass_changed': False,
              'product_acceptance_changed': False,
              'preserved_hashes': {
                  'source_tree_sha256': os.environ['SOURCE_HASH'],
                  'final_simulation_mesh_sha256': os.environ['MESH_HASH'],
                  'frame180_evidence_png_sha256': os.environ['PNG_HASH'],
                  'cp3_receipt_sha256': os.environ['RECEIPT_HASH'],
              },
              'next_task': 'GARMENT-SIZING-R0A / CP0',
          }
          (root / 'DESIGN_STATUS.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY

          after_source="$(find "$root/source" -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          after_mesh="$(sha256sum "$root/build/tunic_pilot/warp_cp3/final_simulation_mesh.npz" | awk '{print $1}')"
          after_png="$(sha256sum "$root/build/tunic_pilot/warp_cp3/cp3_frame180_evidence.png" | awk '{print $1}')"
          after_receipt="$(sha256sum "$root/build/tunic_pilot/warp_cp3/cp3_receipt.json" | awk '{print $1}')"
          test "$before_source" = "$after_source"
          test "$before_mesh" = "$after_mesh"
          test "$before_png" = "$after_png"
          test "$before_receipt" = "$after_receipt"
          echo "ROOT=$root" >> "$GITHUB_ENV"

      - name: Validate design and refresh manifest
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'STANDARD_SIZE' "$ROOT/docs/architecture/GARMENT_SIZING_SYSTEM_KO.md"
          grep -q 'AUTO_BODY_FIT' "$ROOT/docs/architecture/GARMENT_SIZING_SYSTEM_KO.md"
          grep -q 'CUSTOM_MEASUREMENTS' "$ROOT/docs/architecture/GARMENT_SIZING_SYSTEM_KO.md"
          grep -q 'arbitrary-N' "$ROOT/docs/architecture/GARMENT_SIZING_SYSTEM_KO.md"
          grep -q 'CP6' "$ROOT/docs/roadmap/GARMENT_SIZING_R0A_ROADMAP_KO.md"
          grep -q 'GARMENT-SIZING-R0A / CP0' "$ROOT/NEXT_TASK.md"

          find "$ROOT" -type d \( -name __pycache__ -o -name .pytest_cache \) -prune -exec rm -rf {} +
          find "$ROOT" -type f \( -name '*.pyc' -o -name '*.pyo' -o -name '*.blend1' -o -name '*.whl' \) -delete
          python - "$ROOT" <<'PY'
          import hashlib, json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          required = [
              'docs/architecture/GARMENT_SIZING_SYSTEM_KO.md',
              'docs/roadmap/GARMENT_SIZING_R0A_ROADMAP_KO.md',
              'docs/architecture/CP2B_WARP_BACKEND_DESIGN_KO.md',
              'docs/cp2b/GARMENT_SIZING_DESIGN_REVISION_KO.md',
              'DESIGN_STATUS.json',
              'NEXT_TASK.md',
          ]
          for rel in required:
              path = root / rel
              assert path.is_file() and path.stat().st_size > 100, rel
          status = json.loads((root / 'STATUS.json').read_text())
          assert status['technical_pass'] is False
          assert status['product_acceptance'] is False
          rows = []
          for path in sorted(root.rglob('*')):
              if path.is_file() and path.name != 'MANIFEST.sha256':
                  rows.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.relative_to(root).as_posix()}")
          (root / 'MANIFEST.sha256').write_text('\n'.join(rows) + '\n')
          PY
          (cd "$ROOT" && sha256sum -c MANIFEST.sha256)

      - name: Upload single integrated sizing design bundle
        uses: actions/upload-artifact@v4
        with:
          name: WG_OSS_R0A_CP2B_R4_REV1_CP3_SIZING_DESIGN
          path: ${{ env.ROOT }}
          compression-level: 6
          retention-days: 2
          if-no-files-found: error
