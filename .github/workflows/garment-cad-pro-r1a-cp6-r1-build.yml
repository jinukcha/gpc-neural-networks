name: Garment CAD Pro R1A CP6-R1 Build Checkpoint

on:
  push:
    branches:
      - garment-cad-pro-r1a-cp6-r1-20261001

permissions:
  actions: read
  contents: read

concurrency:
  group: garment-cad-pro-r1a-cp6-r1-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: garment-cad-pro-r1a-cp6-r1-20261001

      - name: Download immutable CP6 integrated predecessor
        uses: actions/download-artifact@v4
        with:
          name: WG_OSS_R0A_GARMENT_CAD_PRO_R1A_CP6_FINAL
          path: ${{ runner.temp }}/base
          repository: jinukcha/gpc-neural-networks
          run-id: 36848757183
          github-token: ${{ github.token }}

      - name: Restore CP6-R1 source checkpoint
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/work/WG_OSS_R0A_GARMENT_CAD_PRO_R1A_CP6_R1_BUILD"
          mkdir -p "$root/source" "$root/scripts" "$root/tests" "$root/godot"
          cp -a "$RUNNER_TEMP/base/." "$root/"
          cat cp6_r1_overlay_chunks/part*.b64 | base64 --decode > "$RUNNER_TEMP/cp6_r1_overlay.tar.gz"
          echo "73f802852c86d9202ab115fc180b0e93507ed6e5adaa9eed13690d63b726b172  $RUNNER_TEMP/cp6_r1_overlay.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/cp6_r1_overlay"
          tar -xzf "$RUNNER_TEMP/cp6_r1_overlay.tar.gz" -C "$RUNNER_TEMP/cp6_r1_overlay"
          cp -a "$RUNNER_TEMP/cp6_r1_overlay/source/." "$root/source/"
          cp -a "$RUNNER_TEMP/cp6_r1_overlay/scripts/." "$root/scripts/"
          cp -a "$RUNNER_TEMP/cp6_r1_overlay/tests/." "$root/tests/"
          cp -a "$RUNNER_TEMP/cp6_r1_overlay/godot/." "$root/godot/"
          chmod +x "$root/scripts/"*.py
          echo "ROOT=$root" >> "$GITHUB_ENV"
          python - "$root" <<'PY'
          import hashlib, json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          paths = (
              'build/pattern_cad_cp1','build/pattern_cad_cp2','build/construction_cp3',
              'build/material_calibration_cp4','build/motion_fit_cp5','build/motion_fit_cp5_r1',
              'build/motion_fit_cp5_r1_closeout','build/garment_cad_pro_cp6','build/tunic_pilot',
              'source/wuxia_garment_oss/pattern_cad','source/wuxia_garment_oss/construction',
              'source/wuxia_garment_oss/materials','source/wuxia_garment_oss/qualification',
              'source/wuxia_garment_oss/sizing','source/wuxia_garment_oss/garments/trousers',
              'source/wuxia_garment_oss/garments/sleeveless_tunic/construction',
              'source/wuxia_garment_oss/garments/sleeveless_tunic/geometry',
              'source/wuxia_garment_oss/garments/sleeveless_tunic/pattern',
              'source/wuxia_garment_oss/garments/sleeveless_tunic/pattern_cad',
              'source/wuxia_garment_oss/garments/sleeveless_tunic/reference.py',
              'source/wuxia_garment_oss/garments/sleeveless_tunic/resolver.py',
          )
          def path_hash(path):
              d=hashlib.sha256()
              if path.is_file():
                  d.update(path.name.encode()); d.update(hashlib.sha256(path.read_bytes()).digest()); return d.hexdigest()
              for item in sorted(x for x in path.rglob('*') if x.is_file()):
                  d.update(item.relative_to(path).as_posix().encode()); d.update(hashlib.sha256(item.read_bytes()).digest())
              return d.hexdigest()
          payload={name:path_hash(root/name) for name in paths}
          target=root/'build/garment_cad_pro_cp6_r1/predecessor_before.json'
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          PY

      - name: Install exact runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir \
            numpy==2.5.3 scipy==1.16.3 matplotlib==3.9.4 pillow==11.1.0
          wheel_dir="$RUNNER_TEMP/warp-wheel"
          mkdir -p "$wheel_dir"
          python -m pip download --disable-pip-version-check --no-cache-dir --no-deps \
            --only-binary=:all: warp-lang==1.17.0 -d "$wheel_dir"
          wheel="$(find "$wheel_dir" -type f -name 'warp_lang-1.17.0-*.whl' | head -1)"
          echo "47cd93636828dd16e55eeb4e77a0e3547b5fb0f383000a3d228629df68f28fd8  $wheel" | sha256sum -c -
          python -m pip install --disable-pip-version-check --no-cache-dir --no-deps "$wheel"

      - name: Build feature-complete topology and 30 motion products
        shell: bash
        run: |
          set -euo pipefail
          env MPLBACKEND=Agg WARP_CACHE_PATH="$RUNNER_TEMP/warp-cache" PYTHONPATH="$ROOT/source:$ROOT/scripts" \
            python "$ROOT/scripts/run_garment_cad_pro_cp6_r1.py" --root "$ROOT"
          python - "$ROOT" <<'PY'
          import json,pathlib,sys
          root=pathlib.Path(sys.argv[1]); build=root/'build/garment_cad_pro_cp6_r1'
          topology=json.loads((build/'topology/topology_receipt.json').read_text())
          suite=json.loads((build/'motion_fit/motion_suite_receipt.json').read_text())
          preliminary=json.loads((build/'cp6_r1_preliminary_receipt.json').read_text())
          assert topology['topology_pass'] and topology['cp3_feature_topology_embodied']
          assert topology['component_count']==14 and topology['vertex_count']==29199 and topology['triangle_count']==55850
          assert suite['suite_pass'] and suite['pass_count']==suite['scenario_count']==30 and suite['acceptance_runtime']
          assert preliminary['feature_tunic_product_written'] and preliminary['feature_tunic_primitive_count']==14
          print(json.dumps({'topology':topology,'suite':suite,'preliminary':preliminary},sort_keys=True))
          PY
          find "$ROOT" -type d \( -name __pycache__ -o -name .pytest_cache -o -name kernel_cache_bin \) -prune -exec rm -rf {} +
          find "$ROOT" -type f \( -name '*.pyc' -o -name '*.pyo' -o -name '*.whl' \) -delete

      - name: Upload resumable product checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: WG_OSS_R0A_GARMENT_CAD_PRO_R1A_CP6_R1_BUILD_CHECKPOINT
          path: ${{ env.ROOT }}
          compression-level: 6
          retention-days: 2
          if-no-files-found: error
