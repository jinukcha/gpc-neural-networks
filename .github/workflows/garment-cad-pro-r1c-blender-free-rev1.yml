name: Garment CAD Pro R1C Blender-free REV1 Design

on:
  push:
    branches:
      - garment-cad-pro-r1c-blender-free-rev1-20261002

permissions:
  actions: read
  contents: write

concurrency:
  group: garment-cad-pro-r1c-blender-free-rev1-20261002
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: garment-cad-pro-r1c-blender-free-rev1-20261002
          persist-credentials: true

      - name: Download immutable CP4-R1 integrated predecessor
        uses: actions/download-artifact@v4
        with:
          name: GARMENT_R1C_CP4_R1_FINAL
          path: ${{ runner.temp }}/base
          repository: jinukcha/gpc-neural-networks
          run-id: 36986369125
          github-token: ${{ github.token }}

      - name: Apply design-only Blender-free REV1 amendment
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/work/GARMENT_R1C_BLENDER_FREE_REV1_DESIGN_FINAL"
          mkdir -p "$root"
          cp -a "$RUNNER_TEMP/base/." "$root/"
          python r1c_blender_free_rev1_overlay/scripts/apply_blender_free_rev1.py \
            --root "$root" \
            --overlay r1c_blender_free_rev1_overlay
          echo "ROOT=$root" >> "$GITHUB_ENV"

      - name: Validate authoritative document update
        shell: bash
        run: |
          set -euo pipefail
          python - "$ROOT" <<'PY'
          import json,pathlib,sys
          root=pathlib.Path(sys.argv[1])
          required=[
            root/'docs/architecture/professional_pattern/BLENDER_FREE_PRODUCT_PIPELINE_REV1_KO.md',
            root/'docs/roadmap/GARMENT_CAD_PRO_R1C_BLENDER_FREE_REV1_ROADMAP_KO.md',
            root/'R1C_BLENDER_FREE_REV1_STATUS.json',
            root/'R1C_BLENDER_FREE_REV1_CHECKS.json',
            root/'NEXT_TASK.md',
          ]
          missing=[path.as_posix() for path in required if not path.is_file()]
          assert not missing,missing
          status=json.loads((root/'R1C_BLENDER_FREE_REV1_STATUS.json').read_text())
          checks=json.loads((root/'R1C_BLENDER_FREE_REV1_CHECKS.json').read_text())
          assert status['design_status']=='COMPLETE'
          assert status['implementation_status']=='NOT_STARTED'
          assert status['blender_required'] is False
          assert checks['source_tree_unchanged']
          assert checks['build_tree_unchanged']
          assert checks['product_tree_unchanged']
          assert checks['product_acceptance_changed'] is False
          assert 'CP4-R2-R1-REV1' in (root/'NEXT_TASK.md').read_text()
          print({'documents':len(required),'status':'PASS','blender_required':False})
          PY

      - name: Diet and manifest integrated bundle
        shell: bash
        run: |
          set -euo pipefail
          find "$ROOT" -type d \( -name __pycache__ -o -name .pytest_cache -o -name .godot -o -name kernel_cache_bin \) -prune -exec rm -rf {} +
          find "$ROOT" -type f \( -name '*.pyc' -o -name '*.pyo' -o -name '*.blend1' -o -name '*.whl' \) -delete
          python "$ROOT/scripts/write_manifest.py" --root "$ROOT"
          (cd "$ROOT" && sha256sum -c MANIFEST.sha256 >/dev/null)

      - name: Publish compact REV1 design authority
        shell: bash
        run: |
          set -euo pipefail
          rm -rf delivery_r1c_blender_free_rev1
          mkdir -p delivery_r1c_blender_free_rev1/architecture delivery_r1c_blender_free_rev1/roadmap
          cp "$ROOT/docs/architecture/professional_pattern/BLENDER_FREE_PRODUCT_PIPELINE_REV1_KO.md" delivery_r1c_blender_free_rev1/architecture/
          cp "$ROOT/docs/roadmap/GARMENT_CAD_PRO_R1C_BLENDER_FREE_REV1_ROADMAP_KO.md" delivery_r1c_blender_free_rev1/roadmap/
          cp "$ROOT/R1C_BLENDER_FREE_REV1_STATUS.json" delivery_r1c_blender_free_rev1/
          cp "$ROOT/R1C_BLENDER_FREE_REV1_CHECKS.json" delivery_r1c_blender_free_rev1/
          cp "$ROOT/NEXT_TASK.md" delivery_r1c_blender_free_rev1/
          git config user.name 'chatgpt-garment-cad'
          git config user.email 'chatgpt-garment-cad@users.noreply.github.com'
          git add delivery_r1c_blender_free_rev1
          if ! git diff --cached --quiet; then
            git commit -m 'Publish GARMENT-CAD-PRO-R1C Blender-free REV1 design [skip ci]'
            git push origin HEAD:garment-cad-pro-r1c-blender-free-rev1-20261002
          fi

      - name: Upload single integrated REV1 design bundle
        uses: actions/upload-artifact@v4
        with:
          name: GARMENT_R1C_BLENDER_FREE_REV1_DESIGN_FINAL
          path: ${{ env.ROOT }}
          compression-level: 6
          retention-days: 2
          if-no-files-found: error
