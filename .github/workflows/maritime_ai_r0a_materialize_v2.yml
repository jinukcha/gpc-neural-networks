name: maritime-ai-r0a-materialize-v2

on:
  push:
    branches:
      - automation/maritime-ai-r0a-oss-workkit-20260930
    paths:
      - .github/workflows/maritime_ai_r0a_materialize_v2.yml

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build selected source workkit
        run: python .github/scripts/maritime_ai_r0a_materialize.py

      - name: Upload selected source workkit
        uses: actions/upload-artifact@v4
        with:
          name: maritime-ai-r0a-oss-workkit-v2
          path: workkit/
          compression-level: 6
          retention-days: 1
          if-no-files-found: error
