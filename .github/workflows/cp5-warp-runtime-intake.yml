name: CP5 Warp runtime intake

on:
  push:
    branches:
      - garment-sizing-r0a-cp5-20261001

permissions:
  contents: read

jobs:
  intake:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download exact Warp wheel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/warp_runtime"
          python -m pip download --disable-pip-version-check --no-deps \
            --dest "$RUNNER_TEMP/warp_runtime" \
            warp-lang==1.17.0
          wheel="$(find "$RUNNER_TEMP/warp_runtime" -maxdepth 1 -name 'warp_lang-1.17.0-py3-none-manylinux_2_28_x86_64.whl' -print -quit)"
          test -n "$wheel"
          echo '47cd93636828dd16e55eeb4e77a0e3547b5fb0f383000a3d228629df68f28fd8  '"$wheel" | sha256sum -c -
      - name: Upload exact Warp wheel
        uses: actions/upload-artifact@v4
        with:
          name: cp5-warp-lang-1.17.0-linux-x86_64
          path: ${{ runner.temp }}/warp_runtime/warp_lang-1.17.0-py3-none-manylinux_2_28_x86_64.whl
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
