name: Garment R1B CP4 Inspect Body Source

on:
  push:
    branches:
      - garment-cad-pro-r1b-cp4-20261001

permissions:
  actions: read
  contents: write

concurrency:
  group: garment-r1b-cp4-inspect
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: garment-cad-pro-r1b-cp4-20261001
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: GARMENT_R1B_CP3_FINAL
          path: ${{ runner.temp }}/base
          repository: jinukcha/gpc-neural-networks
          run-id: 36874764717
          github-token: ${{ github.token }}
      - name: Publish temporary rig source snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf cp4_rig_source_snapshot
          mkdir -p cp4_rig_source_snapshot
          cp -a "$RUNNER_TEMP/base/source/wuxia_garment_oss/rig/." cp4_rig_source_snapshot/
          find cp4_rig_source_snapshot -type d -name __pycache__ -prune -exec rm -rf {} +
          find cp4_rig_source_snapshot -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git config user.name 'chatgpt-garment-cad'
          git config user.email 'chatgpt-garment-cad@users.noreply.github.com'
          git add cp4_rig_source_snapshot
          if ! git diff --cached --quiet; then
            git commit -m 'Publish temporary CP4 rig source snapshot [skip ci]'
            git push origin HEAD:garment-cad-pro-r1b-cp4-20261001
          fi
