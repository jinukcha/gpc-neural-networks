name: Garment R1B CP4 Inspect Body Source

on:
  push:
    branches:
      - garment-cad-pro-r1b-cp4-20261001

permissions:
  actions: read
  contents: write

concurrency:
  group: garment-r1b-cp4-inspect
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: garment-cad-pro-r1b-cp4-20261001
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: GARMENT_R1B_CP3_FINAL
          path: ${{ runner.temp }}/base
          repository: jinukcha/gpc-neural-networks
          run-id: 36874764717
          github-token: ${{ github.token }}
      - name: Publish temporary canonical skeleton fixture
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/base/build/rig_cp0/canonical_skeleton.json" cp4_canonical_skeleton_snapshot.json
          git config user.name 'chatgpt-garment-cad'
          git config user.email 'chatgpt-garment-cad@users.noreply.github.com'
          git add cp4_canonical_skeleton_snapshot.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish temporary CP4 skeleton fixture [skip ci]'
            git push origin HEAD:garment-cad-pro-r1b-cp4-20261001
          fi
