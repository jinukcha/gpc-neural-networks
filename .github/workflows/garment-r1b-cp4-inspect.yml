name: Garment R1B CP4 Inspect Body Source

on:
  push:
    branches:
      - garment-cad-pro-r1b-cp4-20261001

permissions:
  actions: read
  contents: read

concurrency:
  group: garment-r1b-cp4-inspect
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: garment-cad-pro-r1b-cp4-20261001
      - uses: actions/download-artifact@v4
        with:
          name: GARMENT_R1B_CP3_FINAL
          path: ${{ runner.temp }}/base
          repository: jinukcha/gpc-neural-networks
          run-id: 36874764717
          github-token: ${{ github.token }}
      - name: Inspect preserved geometry products
        shell: bash
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/base"
          echo 'CP4_RELEVANT_FILES_BEGIN'
          find "$base/build" -type f \( -iname '*body*' -o -iname '*skin*' -o -iname '*collision*' -o -iname '*.npz' -o -iname '*.glb' \) -printf '%P\t%s\n' | sort | head -1000
          echo 'CP4_RELEVANT_FILES_END'
          python - "$base/build" <<'PY'
          import json,pathlib,sys
          root=pathlib.Path(sys.argv[1])
          for path in sorted(root.rglob('*.json')):
              try: payload=json.loads(path.read_text())
              except Exception: continue
              text=json.dumps(payload,sort_keys=True)
              if any(word in path.as_posix().lower() or word in text[:4000].lower() for word in ('body_skin','body source','collision','vertex_count','triangle_count','archive_path')):
                  summary={'path':path.relative_to(root).as_posix(),'keys':sorted(payload) if isinstance(payload,dict) else [],'sample':text[:4000]}
                  print('CP4_JSON_SUMMARY='+json.dumps(summary,sort_keys=True))
          PY
