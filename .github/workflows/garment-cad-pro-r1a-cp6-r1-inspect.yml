name: Garment CAD Pro R1A CP6-R1 Inspect

on:
  push:
    branches:
      - garment-cad-pro-r1a-cp6-r1-20261001

permissions:
  contents: read

concurrency:
  group: garment-cad-pro-r1a-cp6-r1-inspect
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: garment-cad-pro-r1a-cp6-r1-20261001

      - name: Reconstruct and inspect saved overlay
        shell: bash
        run: |
          set -euo pipefail
          cat cp6_r1_overlay_chunks/part*.b64 | base64 --decode > "$RUNNER_TEMP/cp6_r1_overlay.tar.gz"
          echo "CP6_R1_OVERLAY_SHA256=$(sha256sum "$RUNNER_TEMP/cp6_r1_overlay.tar.gz" | awk '{print $1}')"
          mkdir -p "$RUNNER_TEMP/cp6_r1_overlay"
          tar -xzf "$RUNNER_TEMP/cp6_r1_overlay.tar.gz" -C "$RUNNER_TEMP/cp6_r1_overlay"
          echo '--- run script ---'
          sed -n '1,220p' "$RUNNER_TEMP/cp6_r1_overlay/scripts/run_garment_cad_pro_cp6_r1.py"
          echo '--- finalize script ---'
          sed -n '1,220p' "$RUNNER_TEMP/cp6_r1_overlay/scripts/finalize_garment_cad_pro_cp6_r1.py"
          echo '--- GLB verifier ---'
          cat "$RUNNER_TEMP/cp6_r1_overlay/scripts/verify_garment_cad_pro_cp6_r1_glb.py"
          echo '--- tests ---'
          cat "$RUNNER_TEMP/cp6_r1_overlay/tests/test_garment_cad_pro_cp6_r1.py"
          echo '--- Godot verifier ---'
          cat "$RUNNER_TEMP/cp6_r1_overlay/godot/garment_cad_pro_cp6_r1/verify_import.gd"

      - name: Upload reconstructed checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: GARMENT_CAD_PRO_R1A_CP6_R1_OVERLAY_CHECKPOINT
          path: ${{ runner.temp }}/cp6_r1_overlay
          compression-level: 6
          retention-days: 1
          if-no-files-found: error
