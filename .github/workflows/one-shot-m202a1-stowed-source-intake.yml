name: One-shot M202A1 stowed-source intake

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-m202a1-stowed-source-intake.yml

permissions:
  contents: read

jobs:
  intake:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download official manual and same-model specimen gallery
        run: |
          set -euo pipefail
          mkdir -p intake/official intake/specimen

          curl -L --fail --retry 4 \
            -o intake/official/66_MM_Rocket_Launcher_M202A1.pdf \
            https://upload.wikimedia.org/wikipedia/commons/6/64/66_MM_Rocket_Launcher_M202A1.pdf
          echo "8fceb3aa761d25fedbfb6bae066eff7fa40a4e83  intake/official/66_MM_Rocket_Launcher_M202A1.pdf" | sha1sum -c -

          curl -L --fail --retry 4 \
            -A 'Mozilla/5.0' \
            -o intake/specimen/ima_m202a1_product.html \
            https://www.ima-usa.com/products/original-rare-u-s-m202a1-flash-four-tube-66mm-incendiary-rocket-launcher-inert-1

          python - <<'PY'
          from pathlib import Path
          import html, re, urllib.parse, urllib.request

          root = Path('intake/specimen')
          text = html.unescape((root / 'ima_m202a1_product.html').read_text(errors='replace'))
          patterns = [
              r'https://www\.ima-usa\.com/cdn/shop/files/ONSV24TMB180[^\"\'<> ]+',
              r'https://cdn\.shopify\.com/s/files/[^\"\'<> ]*ONSV24TMB180[^\"\'<> ]+',
              r'//www\.ima-usa\.com/cdn/shop/files/ONSV24TMB180[^\"\'<> ]+',
              r'//cdn\.shopify\.com/s/files/[^\"\'<> ]*ONSV24TMB180[^\"\'<> ]+',
          ]
          urls = []
          for pattern in patterns:
              urls.extend(re.findall(pattern, text))

          cleaned = []
          seen = set()
          for raw in urls:
              raw = raw.rstrip('\\,')
              if raw.startswith('//'):
                  raw = 'https:' + raw
              parts = urllib.parse.urlsplit(raw)
              path = parts.path
              # Prefer the largest directly referenced gallery rendition, but remove crop syntax only.
              path = re.sub(r'_(?:pico|icon|thumb|small|compact|medium|large|grande|master)(?=\.[A-Za-z0-9]+$)', '', path)
              url = urllib.parse.urlunsplit((parts.scheme, parts.netloc, path, parts.query, ''))
              if url not in seen:
                  seen.add(url)
                  cleaned.append(url)

          if not cleaned:
              raise SystemExit('No same-model IMA gallery URLs discovered')

          manifest = []
          for index, url in enumerate(cleaned, 1):
              suffix = Path(urllib.parse.urlsplit(url).path).suffix or '.jpg'
              name = f'ima_{index:02d}{suffix}'
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      data = response.read()
              except Exception as exc:
                  manifest.append(f'FAILED\t{url}\t{exc}')
                  continue
              (root / name).write_bytes(data)
              manifest.append(f'{name}\t{len(data)}\t{url}')

          (root / 'image_urls.tsv').write_text('\n'.join(manifest) + '\n')
          downloaded = [line for line in manifest if not line.startswith('FAILED')]
          if not downloaded:
              raise SystemExit('No same-model IMA images downloaded')
          print('\n'.join(manifest))
          PY

          (cd intake && find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - name: Upload source intake
        uses: actions/upload-artifact@v4
        with:
          name: M202A1-stowed-source-intake
          path: intake
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
