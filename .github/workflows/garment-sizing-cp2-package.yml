name: Garment sizing CP2 package

on:
  push:
    branches:
      - garment-sizing-r0a-cp2-20261001

permissions:
  contents: write
  actions: read

concurrency:
  group: garment-sizing-r0a-cp2-20261001
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: garment-sizing-r0a-cp2-20261001
          persist-credentials: true

      - name: Download CP1 integrated baseline
        uses: actions/download-artifact@v4
        with:
          name: WG_OSS_R0A_CP2B_R4_REV1_GARMENT_SIZING_CP1
          path: ${{ runner.temp }}/base
          repository: jinukcha/gpc-neural-networks
          run-id: 36796803749
          github-token: ${{ github.token }}

      - name: Overlay CP2 implementation and preserve authorities
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/work/WG_OSS_R0A_CP2B_R4_REV1_GARMENT_SIZING_CP2"
          mkdir -p "$root/source" "$root/scripts" "$root/tests"
          cp -a "$RUNNER_TEMP/base/." "$root/"
          before_drape="$(find "$root/source/wuxia_garment_oss/drape" -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          before_mesh="$(sha256sum "$root/build/tunic_pilot/warp_cp3/final_simulation_mesh.npz" | awk '{print $1}')"
          before_png="$(sha256sum "$root/build/tunic_pilot/warp_cp3/cp3_frame180_evidence.png" | awk '{print $1}')"
          before_receipt="$(sha256sum "$root/build/tunic_pilot/warp_cp3/cp3_receipt.json" | awk '{print $1}')"
          receipt_tree="$(cd "$root/build/tunic_pilot/sizing_cp1/selection_receipts" && find . -type f -name '*.json' -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          cp -a cp2_overlay/source/. "$root/source/"
          cp -a cp2_overlay/scripts/. "$root/scripts/"
          cp -a cp2_overlay/tests/. "$root/tests/"
          chmod +x "$root/scripts/"*.py
          after_drape="$(find "$root/source/wuxia_garment_oss/drape" -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          after_mesh="$(sha256sum "$root/build/tunic_pilot/warp_cp3/final_simulation_mesh.npz" | awk '{print $1}')"
          after_png="$(sha256sum "$root/build/tunic_pilot/warp_cp3/cp3_frame180_evidence.png" | awk '{print $1}')"
          after_receipt="$(sha256sum "$root/build/tunic_pilot/warp_cp3/cp3_receipt.json" | awk '{print $1}')"
          test "$before_drape" = "$after_drape"
          test "$before_mesh" = "$after_mesh"
          test "$before_png" = "$after_png"
          test "$before_receipt" = "$after_receipt"
          printf '\n## CP2 구현 상태\n\nCP2는 CP1 selection receipt를 read-only 입력으로 사용해 튜닉 S/M/L, AUTO_BODY_FIT, CUSTOM_MEASUREMENTS fixture의 완성치수 POM, named landmark, open/sewn boundary, 8개 seam identity를 발행한다. 결과는 `GarmentPatternParameterPackage/1`이며 triangulation·Warp·mesh scaling은 수행하지 않는다. 차단 admission은 parameter package를 발행하지 않는다.\n' >> "$root/docs/architecture/GARMENT_SIZING_SYSTEM_KO.md"
          printf '\n## CP2 결과\n\n- S/M/L parametric POM: 구현\n- AUTO_BODY_FIT 및 CUSTOM_MEASUREMENTS: 구현\n- 상세 치수별 front/back 분배: 구현\n- 4-panel named landmarks와 boundary disposition: 구현\n- CP1 receipt hash-preserving consumption: 구현\n- triangulation/Warp: 미실행\n- 다음 단계: CP3 dynamic curves, seam resampling, size-aware triangulation admission\n' >> "$root/docs/roadmap/GARMENT_SIZING_R0A_ROADMAP_KO.md"
          echo "ROOT=$root" >> "$GITHUB_ENV"
          echo "DRAPE_HASH=$after_drape" >> "$GITHUB_ENV"
          echo "MESH_HASH=$after_mesh" >> "$GITHUB_ENV"
          echo "PNG_HASH=$after_png" >> "$GITHUB_ENV"
          echo "CP3_RECEIPT_HASH=$after_receipt" >> "$GITHUB_ENV"
          echo "CP1_RECEIPT_TREE_HASH=$receipt_tree" >> "$GITHUB_ENV"

      - name: Install bounded CP2 tooling
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          numpy==2.1.3 matplotlib==3.9.4 pillow==11.1.0
          pytest==8.3.5 jsonschema==4.25.1

      - name: Execute CP2 parameter pilot
        run: >-
          env MPLBACKEND=Agg PYTHONPATH="$ROOT/source"
          python "$ROOT/scripts/run_garment_sizing_cp2.py" --root "$ROOT"

      - name: Test CP1 and CP2 contracts
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$ROOT/source" pytest -q \
            "$ROOT/tests/test_garment_sizing_cp1.py" \
            "$ROOT/tests/test_garment_sizing_cp2.py"

      - name: Validate CP2 outputs and source budget
        run: python "$ROOT/scripts/validate_garment_sizing_cp2.py" --root "$ROOT"

      - name: Validate schemas and diet bundle
        shell: bash
        run: |
          set -euo pipefail
          python -c "import json,pathlib; from jsonschema import Draft202012Validator; p=pathlib.Path('$ROOT/contracts/sizing'); s=list(p.glob('*.schema.json')); assert len(s)==10; [Draft202012Validator.check_schema(json.loads(x.read_text())) for x in s]"
          find "$ROOT" -type d \( -name __pycache__ -o -name .pytest_cache \) -prune -exec rm -rf {} +
          find "$ROOT" -type f \( -name '*.pyc' -o -name '*.pyo' -o -name '*.blend1' -o -name '*.whl' \) -delete
          python "$ROOT/scripts/write_manifest.py" --root "$ROOT"
          (cd "$ROOT" && sha256sum -c MANIFEST.sha256)

      - name: Publish CP2 PNG evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf delivery_cp2
          mkdir -p delivery_cp2
          cp "$ROOT/build/tunic_pilot/sizing_cp2/cp2_pattern_parameter_evidence.png" delivery_cp2/
          cp "$ROOT/build/tunic_pilot/sizing_cp2/cp2_receipt.json" delivery_cp2/
          cp "$ROOT/SIZING_STATUS.json" delivery_cp2/
          git config user.name 'chatgpt-garment-sizing'
          git config user.email 'chatgpt-garment-sizing@users.noreply.github.com'
          git add delivery_cp2
          if ! git diff --cached --quiet; then
            git commit -m 'Publish garment sizing CP2 evidence [skip ci]'
            git push origin HEAD:garment-sizing-r0a-cp2-20261001
          fi

      - name: Upload single integrated CP2 bundle
        uses: actions/upload-artifact@v4
        with:
          name: WG_OSS_R0A_CP2B_R4_REV1_GARMENT_SIZING_CP2
          path: ${{ env.ROOT }}
          compression-level: 6
          retention-days: 2
          if-no-files-found: error
