name: Garment CAD Pro R1A CP6

on:
  push:
    branches:
      - garment-cad-pro-r1a-cp6-20261001

permissions:
  contents: write
  actions: read

concurrency:
  group: garment-cad-pro-r1a-cp6-20261001
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: garment-cad-pro-r1a-cp6-20261001
          persist-credentials: true

      - name: Download immutable CP5-R1 integrated predecessor
        uses: actions/download-artifact@v4
        with:
          name: WG_OSS_R0A_GARMENT_CAD_PRO_R1A_CP5_R1_FINAL
          path: ${{ runner.temp }}/base
          repository: jinukcha/gpc-neural-networks
          run-id: 36839280076
          github-token: ${{ github.token }}

      - name: Overlay CP6 implementation
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/work/WG_OSS_R0A_GARMENT_CAD_PRO_R1A_CP6"
          mkdir -p "$root/source" "$root/scripts" "$root/tests"
          cp -a "$RUNNER_TEMP/base/." "$root/"
          tree_hash() {
            python -c 'import hashlib,pathlib,sys; p=pathlib.Path(sys.argv[1]); d=hashlib.sha256(); items=sorted(x for x in p.rglob("*") if x.is_file()); [(d.update(x.relative_to(p).as_posix().encode("utf-8")),d.update(hashlib.sha256(x.read_bytes()).digest())) for x in items]; print(d.hexdigest())' "$1"
          }
          cp5_hash="$(tree_hash "$root/build/motion_fit_cp5")"
          cp5_r1_hash="$(tree_hash "$root/build/motion_fit_cp5_r1")"
          cp5_closeout_hash="$(tree_hash "$root/build/motion_fit_cp5_r1_closeout")"
          pattern_hash="$(tree_hash "$root/build/pattern_cad_cp2")"
          construction_hash="$(tree_hash "$root/build/construction_cp3")"
          material_hash="$(tree_hash "$root/build/material_calibration_cp4")"
          tunic_hash="$(tree_hash "$root/build/tunic_pilot")"
          cp -a cp6_pro_overlay/source/. "$root/source/"
          cp -a cp6_pro_overlay/scripts/. "$root/scripts/"
          cp -a cp6_pro_overlay/tests/. "$root/tests/"
          chmod +x "$root/scripts/"*.py
          echo "ROOT=$root" >> "$GITHUB_ENV"
          echo "EXPECTED_CP5_HASH=$cp5_hash" >> "$GITHUB_ENV"
          echo "EXPECTED_CP5_R1_HASH=$cp5_r1_hash" >> "$GITHUB_ENV"
          echo "EXPECTED_CP5_CLOSEOUT_HASH=$cp5_closeout_hash" >> "$GITHUB_ENV"
          echo "EXPECTED_PATTERN_HASH=$pattern_hash" >> "$GITHUB_ENV"
          echo "EXPECTED_CONSTRUCTION_HASH=$construction_hash" >> "$GITHUB_ENV"
          echo "EXPECTED_MATERIAL_HASH=$material_hash" >> "$GITHUB_ENV"
          echo "EXPECTED_TUNIC_HASH=$tunic_hash" >> "$GITHUB_ENV"

      - name: Install exact Warp and bounded tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir \
            numpy==2.5.3 matplotlib==3.9.4 pillow==11.1.0 pytest==8.3.5 jsonschema==4.25.1
          wheel_dir="$RUNNER_TEMP/warp-wheel"
          mkdir -p "$wheel_dir"
          python -m pip download --disable-pip-version-check --no-cache-dir --no-deps \
            --only-binary=:all: warp-lang==1.17.0 -d "$wheel_dir"
          wheel="$(find "$wheel_dir" -type f -name 'warp_lang-1.17.0-*.whl' | head -1)"
          echo "47cd93636828dd16e55eeb4e77a0e3547b5fb0f383000a3d228629df68f28fd8  $wheel" | sha256sum -c -
          python -m pip install --disable-pip-version-check --no-cache-dir --no-deps "$wheel"

      - name: Build manufacturing and game products
        run: >-
          env MPLBACKEND=Agg WARP_CACHE_PATH="$RUNNER_TEMP/warp-cache" PYTHONPATH="$ROOT/source"
          python "$ROOT/scripts/run_garment_cad_pro_cp6.py" --root "$ROOT"

      - name: Fresh-process GLB reopen
        run: >-
          env PYTHONPATH="$ROOT/source"
          python "$ROOT/scripts/verify_garment_cad_pro_cp6_glb.py" --root "$ROOT"

      - name: Godot 4.7.2 read-only import and fresh reopen
        shell: bash
        run: |
          set -euo pipefail
          project="$ROOT/build/garment_cad_pro_cp6/godot_product"
          mkdir -p "$project/products"
          cp cp6_pro_overlay/godot_product/project.godot "$project/project.godot"
          cp cp6_pro_overlay/godot_product/verify_import.gd "$project/verify_import.gd"
          cp "$ROOT/build/garment_cad_pro_cp6/game_products/sleeveless_tunic.glb" "$project/products/"
          cp "$ROOT/build/garment_cad_pro_cp6/game_products/trousers.glb" "$project/products/"
          runtime="$RUNNER_TEMP/godot-4.7.2"
          mkdir -p "$runtime"
          base="https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable"
          curl -fsSL "$base/Godot_v4.7.2-stable_linux.x86_64.zip" -o "$runtime/Godot_v4.7.2-stable_linux.x86_64.zip"
          curl -fsSL "$base/Godot_v4.7.2-stable_linux.x86_64.zip.sha256" -o "$runtime/Godot_v4.7.2-stable_linux.x86_64.zip.sha256"
          (cd "$runtime" && sha256sum -c Godot_v4.7.2-stable_linux.x86_64.zip.sha256)
          unzip -q "$runtime/Godot_v4.7.2-stable_linux.x86_64.zip" -d "$runtime"
          godot="$(find "$runtime" -maxdepth 2 -type f -name 'Godot_v4.7.2-stable_linux.x86_64' | head -1)"
          chmod +x "$godot"
          "$godot" --headless --editor --path "$project" --quit-after 120 > "$project/import.log" 2>&1
          "$godot" --headless --path "$project" --script res://verify_import.gd > "$project/reopen.log" 2>&1
          python - <<'PY'
          import json, os, pathlib
          project=pathlib.Path(os.environ['ROOT'])/'build/garment_cad_pro_cp6/godot_product'
          lines=(project/'reopen.log').read_text(errors='replace').splitlines()
          marker='CP6_GODOT_RECEIPT='
          rows=[line.split(marker,1)[1] for line in lines if marker in line]
          assert rows, (project/'reopen.log').read_text(errors='replace')
          payload=json.loads(rows[-1])
          assert payload['consumer_pass'] is True, payload
          (project/'godot_consumer_receipt.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          PY
          rm -rf "$project/.godot" "$runtime"

      - name: Verify predecessor preservation and finalize
        shell: bash
        run: |
          set -euo pipefail
          tree_hash() {
            python -c 'import hashlib,pathlib,sys; p=pathlib.Path(sys.argv[1]); d=hashlib.sha256(); items=sorted(x for x in p.rglob("*") if x.is_file()); [(d.update(x.relative_to(p).as_posix().encode("utf-8")),d.update(hashlib.sha256(x.read_bytes()).digest())) for x in items]; print(d.hexdigest())' "$1"
          }
          python - <<'PY'
          import json, os, pathlib, subprocess
          root=pathlib.Path(os.environ['ROOT'])
          def tree_hash(path):
              import hashlib
              d=hashlib.sha256()
              for item in sorted(x for x in path.rglob('*') if x.is_file()):
                  d.update(item.relative_to(path).as_posix().encode())
                  d.update(hashlib.sha256(item.read_bytes()).digest())
              return d.hexdigest()
          checks={
              'motion_fit_cp5': (root/'build/motion_fit_cp5', os.environ['EXPECTED_CP5_HASH']),
              'motion_fit_cp5_r1': (root/'build/motion_fit_cp5_r1', os.environ['EXPECTED_CP5_R1_HASH']),
              'motion_fit_cp5_r1_closeout': (root/'build/motion_fit_cp5_r1_closeout', os.environ['EXPECTED_CP5_CLOSEOUT_HASH']),
              'pattern_cad_cp2': (root/'build/pattern_cad_cp2', os.environ['EXPECTED_PATTERN_HASH']),
              'construction_cp3': (root/'build/construction_cp3', os.environ['EXPECTED_CONSTRUCTION_HASH']),
              'material_cp4': (root/'build/material_calibration_cp4', os.environ['EXPECTED_MATERIAL_HASH']),
              'tunic_pilot': (root/'build/tunic_pilot', os.environ['EXPECTED_TUNIC_HASH']),
          }
          rows={}
          for name,(path,expected) in checks.items():
              actual=tree_hash(path)
              rows[name]={'expected':expected,'actual':actual,'unchanged':actual==expected}
          payload={'contract':'CP6PredecessorPreservationReceipt/1','owners':rows,'all_predecessors_unchanged':all(x['unchanged'] for x in rows.values())}
          assert payload['all_predecessors_unchanged'], payload
          target=root/'build/garment_cad_pro_cp6/predecessor_preservation.json'
          target.write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          PY
          PYTHONPATH="$ROOT/source" python "$ROOT/scripts/finalize_garment_cad_pro_cp6.py" --root "$ROOT"

      - name: Test and validate CP6
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$ROOT/source" pytest -q "$ROOT/tests/test_garment_cad_pro_cp6.py"
          python - <<'PY'
          import ast, json, os, pathlib
          root=pathlib.Path(os.environ['ROOT'])
          files=sorted((root/'source').rglob('*.py'))+sorted((root/'scripts').glob('*.py'))
          max_file=('',0); max_function=('', '',0); violations=[]
          for path in files:
              text=path.read_text(); loc=len(text.splitlines())
              max_file=max(max_file,(str(path.relative_to(root)),loc),key=lambda x:x[1])
              if loc>500: violations.append(('file',str(path),loc))
              tree=ast.parse(text)
              for node in ast.walk(tree):
                  if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)):
                      size=getattr(node,'end_lineno',node.lineno)-node.lineno+1
                      max_function=max(max_function,(str(path.relative_to(root)),node.name,size),key=lambda x:x[2])
                      if size>80: violations.append(('function',str(path),node.name,size))
          assert not violations, violations
          checks=json.loads((root/'PROFESSIONAL_CHECKS.json').read_text()) if (root/'PROFESSIONAL_CHECKS.json').exists() else {}
          checks['cp6_tests']='PASS'
          checks['cp6_source_budget']={'files':len(files),'max_file':max_file,'max_function':max_function,'violations':[]}
          (root/'PROFESSIONAL_CHECKS.json').write_text(json.dumps(checks,indent=2,sort_keys=True)+'\n')
          PY
          python - <<'PY'
          import json, pathlib, os
          from jsonschema import Draft202012Validator
          root=pathlib.Path(os.environ['ROOT'])
          schemas=sorted((root/'contracts/export').glob('*.schema.json'))
          assert len(schemas)==6
          for path in schemas: Draft202012Validator.check_schema(json.loads(path.read_text()))
          PY

      - name: Diet and manifest
        shell: bash
        run: |
          set -euo pipefail
          find "$ROOT" -type d \( -name __pycache__ -o -name .pytest_cache -o -name kernel_cache_bin -o -name .godot \) -prune -exec rm -rf {} +
          find "$ROOT" -type f \( -name '*.pyc' -o -name '*.pyo' -o -name '*.blend1' -o -name '*.whl' \) -delete
          rm -f "$ROOT/build/garment_cad_pro_cp6/godot_product/import.log" "$ROOT/build/garment_cad_pro_cp6/godot_product/reopen.log"
          python "$ROOT/scripts/write_manifest.py" --root "$ROOT"
          (cd "$ROOT" && sha256sum -c MANIFEST.sha256)

      - name: Publish CP6 evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf delivery_pro_cp6
          mkdir -p delivery_pro_cp6
          cp "$ROOT/build/garment_cad_pro_cp6/cp6_manufacturing_2d_evidence.png" delivery_pro_cp6/
          cp "$ROOT/build/garment_cad_pro_cp6/cp6_game_products_evidence.png" delivery_pro_cp6/
          cp "$ROOT/build/garment_cad_pro_cp6/cp6_trousers_fit_evidence.png" delivery_pro_cp6/
          cp "$ROOT/build/garment_cad_pro_cp6/cp6_receipt.json" delivery_pro_cp6/
          cp "$ROOT/build/garment_cad_pro_cp6/trousers/topology_receipt.json" delivery_pro_cp6/
          git config user.name 'chatgpt-garment-cad'
          git config user.email 'chatgpt-garment-cad@users.noreply.github.com'
          git add delivery_pro_cp6
          if ! git diff --cached --quiet; then
            git commit -m 'Publish garment CAD Pro CP6 evidence [skip ci]'
            git push origin HEAD:garment-cad-pro-r1a-cp6-20261001
          fi

      - name: Upload single integrated CP6 bundle
        uses: actions/upload-artifact@v4
        with:
          name: WG_OSS_R0A_GARMENT_CAD_PRO_R1A_CP6
          path: ${{ env.ROOT }}
          compression-level: 6
          retention-days: 2
          if-no-files-found: error
