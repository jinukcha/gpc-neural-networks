name: Garment CAD Pro R1A CP4

on:
  push:
    branches:
      - garment-cad-pro-r1a-cp4-20261001

permissions:
  contents: write
  actions: read

concurrency:
  group: garment-cad-pro-r1a-cp4-20261001
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: garment-cad-pro-r1a-cp4-20261001
          persist-credentials: true

      - name: Download CP3 integrated predecessor
        uses: actions/download-artifact@v4
        with:
          name: WG_OSS_R0A_GARMENT_CAD_PRO_R1A_CP3
          path: ${{ runner.temp }}/base
          repository: jinukcha/gpc-neural-networks
          run-id: 36829668356
          github-token: ${{ github.token }}

      - name: Overlay CP4 material implementation
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/work/WG_OSS_R0A_GARMENT_CAD_PRO_R1A_CP4"
          mkdir -p "$root/source" "$root/scripts" "$root/tests" "$root/docs/architecture/professional"
          cp -a "$RUNNER_TEMP/base/." "$root/"
          tree_hash() {
            python -c 'import hashlib,pathlib,sys; p=pathlib.Path(sys.argv[1]); d=hashlib.sha256(); items=sorted(x for x in p.rglob("*") if x.is_file()); [(d.update(x.relative_to(p).as_posix().encode("utf-8")),d.update(hashlib.sha256(x.read_bytes()).digest())) for x in items]; print(d.hexdigest())' "$1"
          }
          pattern_cp1_hash="$(tree_hash "$root/build/pattern_cad_cp1")"
          pattern_cp2_hash="$(tree_hash "$root/build/pattern_cad_cp2")"
          construction_cp3_hash="$(tree_hash "$root/build/construction_cp3")"
          tunic_hash="$(tree_hash "$root/build/tunic_pilot")"
          pattern_source_hash="$(tree_hash "$root/source/wuxia_garment_oss/pattern_cad")"
          construction_source_hash="$(tree_hash "$root/source/wuxia_garment_oss/construction")"
          tunic_pattern_hash="$(tree_hash "$root/source/wuxia_garment_oss/garments/sleeveless_tunic/pattern_cad")"
          tunic_construction_hash="$(tree_hash "$root/source/wuxia_garment_oss/garments/sleeveless_tunic/construction")"
          sizing_hash="$(tree_hash "$root/source/wuxia_garment_oss/sizing")"
          drape_hash="$(tree_hash "$root/source/wuxia_garment_oss/drape")"
          cp -a cp4_pro_overlay/source/. "$root/source/"
          cp -a cp4_pro_overlay/scripts/. "$root/scripts/"
          cp -a cp4_pro_overlay/tests/. "$root/tests/"
          chmod +x "$root/scripts/"*.py
          test "$pattern_cp1_hash" = "$(tree_hash "$root/build/pattern_cad_cp1")"
          test "$pattern_cp2_hash" = "$(tree_hash "$root/build/pattern_cad_cp2")"
          test "$construction_cp3_hash" = "$(tree_hash "$root/build/construction_cp3")"
          test "$tunic_hash" = "$(tree_hash "$root/build/tunic_pilot")"
          test "$pattern_source_hash" = "$(tree_hash "$root/source/wuxia_garment_oss/pattern_cad")"
          test "$construction_source_hash" = "$(tree_hash "$root/source/wuxia_garment_oss/construction")"
          test "$tunic_pattern_hash" = "$(tree_hash "$root/source/wuxia_garment_oss/garments/sleeveless_tunic/pattern_cad")"
          test "$tunic_construction_hash" = "$(tree_hash "$root/source/wuxia_garment_oss/garments/sleeveless_tunic/construction")"
          test "$sizing_hash" = "$(tree_hash "$root/source/wuxia_garment_oss/sizing")"
          test "$drape_hash" = "$(tree_hash "$root/source/wuxia_garment_oss/drape")"
          cat > "$root/docs/architecture/professional/MATERIAL_CALIBRATION_PIPELINE_KO.md" <<'DOC'
          # Material Calibration Pipeline

          CP4는 CP3 PatternDocument와 ConstructionPackage를 read-only predecessor로 사용한다.
          MaterialMeasurementSet/1은 raw tensile, shear, bending, compression, friction, shrinkage
          관측값과 uncertainty, specimen·method provenance를 소유한다. CP4의 세 데이터셋은
          PROJECT_REFERENCE_LAB_SERIES이며 외부 공인 시험성적서가 아니다.

          Calibration은 MaterialSizingProfile/2와 WarpMaterialProfile/1을 발행하고 실험군별
          normalized residual을 보존한다. CPU reference와 exact warp-lang 1.17.0 CPU backend는
          동일 static fixture와 parameter identity를 소비하며 response array와 metric parity를
          동시에 검사한다. 일부 material 완료 시 atomic checkpoint를 저장하고 별도 프로세스에서
          동일 measurement hash로 resume한다. Motion fit과 제품 수락은 CP5 범위다.
          DOC
          cat >> "$root/docs/roadmap/GARMENT_CAD_PRO_R1A_ROADMAP_KO.md" <<'DOC'

          ## CP4 결과

          - 3 MaterialMeasurementSet reference fixtures: 구현
          - tensile/shear/bending/compression/friction/shrinkage calibration: 구현
          - MaterialSizingProfile/2, WarpMaterialProfile/1: 구현
          - atomic checkpoint / fresh-process resume: 구현
          - exact Warp 1.17.0 CPU / CPU-reference static-fixture parity: 구현
          - motion fit: 미실행
          - 다음 단계: CP5 motion-fit suite / stress-strain-pressure-clearance maps
          DOC
          echo "ROOT=$root" >> "$GITHUB_ENV"
          echo "EXPECTED_PATTERN_CAD_CP1_HASH=$pattern_cp1_hash" >> "$GITHUB_ENV"
          echo "EXPECTED_PATTERN_CAD_CP2_HASH=$pattern_cp2_hash" >> "$GITHUB_ENV"
          echo "EXPECTED_CONSTRUCTION_CP3_HASH=$construction_cp3_hash" >> "$GITHUB_ENV"
          echo "EXPECTED_TUNIC_BUILD_HASH=$tunic_hash" >> "$GITHUB_ENV"
          echo "EXPECTED_PATTERN_CAD_SOURCE_HASH=$pattern_source_hash" >> "$GITHUB_ENV"
          echo "EXPECTED_CONSTRUCTION_SOURCE_HASH=$construction_source_hash" >> "$GITHUB_ENV"
          echo "EXPECTED_TUNIC_PATTERN_CAD_SOURCE_HASH=$tunic_pattern_hash" >> "$GITHUB_ENV"
          echo "EXPECTED_TUNIC_CONSTRUCTION_SOURCE_HASH=$tunic_construction_hash" >> "$GITHUB_ENV"
          echo "EXPECTED_SIZING_SOURCE_HASH=$sizing_hash" >> "$GITHUB_ENV"
          echo "EXPECTED_DRAPE_SOURCE_HASH=$drape_hash" >> "$GITHUB_ENV"

      - name: Install exact Warp and bounded CP4 tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir \
            numpy==2.5.3 matplotlib==3.9.4 pillow==11.1.0 pytest==8.3.5 jsonschema==4.25.1
          wheel_dir="$RUNNER_TEMP/warp-wheel"
          mkdir -p "$wheel_dir"
          python -m pip download --disable-pip-version-check --no-cache-dir --no-deps \
            --only-binary=:all: warp-lang==1.17.0 -d "$wheel_dir"
          wheel="$(find "$wheel_dir" -type f -name 'warp_lang-1.17.0-*.whl' | head -1)"
          test -n "$wheel"
          echo "47cd93636828dd16e55eeb4e77a0e3547b5fb0f383000a3d228629df68f28fd8  $wheel" | sha256sum -c -
          python -m pip install --disable-pip-version-check --no-cache-dir --no-deps "$wheel"

      - name: Write atomic partial calibration checkpoint
        run: >-
          env MPLBACKEND=Agg PYTHONPATH="$ROOT/source"
          python "$ROOT/scripts/run_garment_cad_pro_cp4.py" --root "$ROOT" --phase checkpoint

      - name: Fresh-process resume and CPU-Warp parity
        run: >-
          env MPLBACKEND=Agg PYTHONPATH="$ROOT/source"
          python "$ROOT/scripts/run_garment_cad_pro_cp4.py" --root "$ROOT" --phase resume

      - name: Test CP1 through CP4 professional CAD
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$ROOT/source" pytest -q \
            "$ROOT/tests/test_garment_cad_pro_cp1.py" \
            "$ROOT/tests/test_garment_cad_pro_cp2.py" \
            "$ROOT/tests/test_garment_cad_pro_cp3.py" \
            "$ROOT/tests/test_garment_cad_pro_cp4.py"

      - name: Validate CP4 outputs and source budget
        shell: bash
        run: |
          set -euo pipefail
          find "$ROOT" -type d -name __pycache__ -prune -exec rm -rf {} +
          find "$ROOT" -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          python "$ROOT/scripts/validate_garment_cad_pro_cp4.py" --root "$ROOT"

      - name: Validate schemas and diet bundle
        shell: bash
        run: |
          set -euo pipefail
          python -c "import json,pathlib; from jsonschema import Draft202012Validator; p=pathlib.Path('$ROOT/contracts/materials'); s=sorted(p.glob('*.schema.json')); assert len(s)==5; [Draft202012Validator.check_schema(json.loads(x.read_text())) for x in s]"
          find "$ROOT" -type d \( -name __pycache__ -o -name .pytest_cache -o -name kernel_cache_bin \) -prune -exec rm -rf {} +
          find "$ROOT" -type f \( -name '*.pyc' -o -name '*.pyo' -o -name '*.blend1' -o -name '*.whl' \) -delete
          python "$ROOT/scripts/write_manifest.py" --root "$ROOT"
          (cd "$ROOT" && sha256sum -c MANIFEST.sha256)

      - name: Publish CP4 PNG evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf delivery_pro_cp4
          mkdir -p delivery_pro_cp4
          cp "$ROOT/build/material_calibration_cp4/cp4_material_calibration_evidence.png" delivery_pro_cp4/
          cp "$ROOT/build/material_calibration_cp4/cp4_receipt.json" delivery_pro_cp4/
          cp "$ROOT/PROFESSIONAL_STATUS.json" delivery_pro_cp4/
          git config user.name 'chatgpt-garment-cad'
          git config user.email 'chatgpt-garment-cad@users.noreply.github.com'
          git add delivery_pro_cp4
          if ! git diff --cached --quiet; then
            git commit -m 'Publish garment CAD Pro CP4 evidence [skip ci]'
            git push origin HEAD:garment-cad-pro-r1a-cp4-20261001
          fi

      - name: Upload single integrated CP4 bundle
        uses: actions/upload-artifact@v4
        with:
          name: WG_OSS_R0A_GARMENT_CAD_PRO_R1A_CP4
          path: ${{ env.ROOT }}
          compression-level: 6
          retention-days: 2
          if-no-files-found: error
