name: RCF R0A CP2 straight wall span

on:
  push:
    branches:
      - automation/rcf-cp0-delivery-20260925
    paths:
      - .github/workflows/rcf-r0a-cp2.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  cp2:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up exact CPython 3.13.5
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'

      - name: Download exact 58-wheel CP0 artifact
        uses: actions/download-artifact@v4
        with:
          name: rcf-cp0-cp313-linux-wheelhouse-58
          path: inputs/wheel_artifact
          repository: jinukcha/gpc-neural-networks
          run-id: 36093161115
          github-token: ${{ github.token }}

      - name: Download and verify immutable inputs
        shell: bash
        env:
          RCK0_URL: "https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-f788-81f7-b7c6-567e869bb565/raw?se=2026-09-25T06%3A17%3A23Z&sp=r&sv=2026-02-06&sr=b&scid=542a5ba5-1cfb-522b-9428-6bec416f6d88&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-25T02%3A20%3A30Z&ske=2026-09-26T02%3A20%3A30Z&sks=b&skv=2026-02-06&sig=k997eAL%2B4LelqIYqKjubW8YnmP6Mpwx0q/6rhXoT/EM%3D"
          D0P_URL: "https://sdmntprwestus.oaiusercontent.com/files/00000000-cd78-8230-ae41-d636db5c340b/raw?se=2026-09-25T06%3A17%3A39Z&sp=r&sv=2026-02-06&sr=b&scid=943f6bbc-45cc-536a-ac33-638c1b3cd3ed&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-25T02%3A00%3A14Z&ske=2026-09-26T02%3A00%3A14Z&sks=b&skv=2026-02-06&sig=1rQj%2BxC5knR7HUSjbgNTa6fUzwwJLlSeuCu%2Buq8%2BfAs%3D"
          A1S_URL: "https://sdmntprcentralus.oaiusercontent.com/files/00000000-85d0-81f5-b6b3-1e7da083098d/raw?se=2026-09-25T06%3A17%3A46Z&sp=r&sv=2026-02-06&sr=b&scid=9f9edfe5-18e5-5b09-ab1d-cece1ef9b772&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-25T03%3A56%3A13Z&ske=2026-09-26T03%3A56%3A13Z&sks=b&skv=2026-02-06&sig=s7qOeqoI5vYHolORExJdUWTSu7zWCqab6Tvfwnb/GmM%3D"
        run: |
          set -euo pipefail
          mkdir -p inputs/files
          curl --fail --location --retry 3 "$RCK0_URL" -o inputs/files/RC_K0.zip
          curl --fail --location --retry 3 "$D0P_URL" -o inputs/files/RCF_D0_patch.zip
          curl --fail --location --retry 3 "$A1S_URL" -o inputs/files/A1S.zip
          echo "7f637daf8e6fd1e055cca31e4d287072cc96ae0bb4028121c5471d34905a38ac  inputs/files/RC_K0.zip" | sha256sum -c -
          echo "15369b830e049937e0d980100197c617285687316bea96339b1ed5dc4cb7c47b  inputs/files/RCF_D0_patch.zip" | sha256sum -c -
          echo "56d573c5c82bd421a423f82d251e42553298eccb9bae35a7c95278c209ce8b9d  inputs/files/A1S.zip" | sha256sum -c -

      - name: Implement, checkpoint, qualify and package CP2
        id: build
        shell: bash
        run: |
          set +e
          python rcf_cp2/rcf_cp2_build.py \
            --inputs inputs/files \
            --wheel-artifact inputs/wheel_artifact \
            --work work/cp2 \
            --packages deliver \
            2>&1 | tee cp2-build.log
          code=${PIPESTATUS[0]}
          echo "$code" > CP2_EXIT_CODE.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Preserve pre-validation checkpoint as release assets
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: rcf-r0a-cp2-20260925-r1
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "RCF R0A CP2 checkpoints" --notes "Straight wall-span CP2 pre-validation and final delivery assets."
          fi
          files=(deliver/A2_pre.zip deliver/A2_preP.zip deliver/A2_preS.zip deliver/A2_pre_check.json cp2-build.log CP2_EXIT_CODE.txt)
          existing=()
          for f in "${files[@]}"; do [[ -f "$f" ]] && existing+=("$f"); done
          ((${#existing[@]})) && gh release upload "$TAG" "${existing[@]}" --clobber

      - name: Upload final release assets
        if: steps.build.outputs.exit_code == '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: rcf-r0a-cp2-20260925-r1
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            deliver/A2.zip deliver/A2P.zip deliver/A2S.zip \
            deliver/A2.md deliver/A2.json deliver/A2.txt deliver/A2.sha256 \
            --clobber

      - name: Upload concise receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rcf-r0a-cp2-receipts
          path: |
            CP2_EXIT_CODE.txt
            cp2-build.log
            deliver/A2.md
            deliver/A2.json
            deliver/A2.txt
            deliver/A2.sha256
            deliver/A2_pre_check.json
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce CP2 result
        shell: bash
        run: |
          test "$(cat CP2_EXIT_CODE.txt)" = "0"
