name: cp0-offline-artifact

on:
  push:
    branches:
      - cp0-offline-intake-20260929
    paths:
      - .github/workflows/cp0-offline-artifact.yml

permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download released public OSS intake
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/relay"
          gh release download r4d-cp0-intake-20260929 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'cp0-offline-intake.tar.zst*' \
            --dir "$RUNNER_TEMP/relay"
          cd "$RUNNER_TEMP/relay"
          expected="$(awk 'NR==1 {print $1}' cp0-offline-intake.tar.zst.sha256)"
          actual="$(sha256sum cp0-offline-intake.tar.zst | awk '{print $1}')"
          test "$actual" = "$expected"
      - name: Upload relay artifact
        uses: actions/upload-artifact@v4
        with:
          name: cp0-offline-intake-relay
          path: ${{ runner.temp }}/relay
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
