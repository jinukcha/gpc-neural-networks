name: RCF inspect A1 status

on:
  push:
    branches:
      - automation/rcf-cp0-delivery-20260925
    paths:
      - .github/workflows/rcf-inspect-a1-status.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        env:
          A1S_URL: "https://sdmntprcentralus.oaiusercontent.com/files/00000000-7bd8-81f5-8620-3ba1cfadd1a1/raw?se=2026-09-25T06%3A14%3A10Z&sp=r&sv=2026-02-06&sr=b&scid=1491e445-80e9-5d33-8a23-8361e7ec1122&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-25T05%3A50%3A20Z&ske=2026-09-26T05%3A50%3A20Z&sks=b&skv=2026-02-06&sig=ktdgO2A4qQc44FK5uxm4rb%2BcB4czoD4dDag%2BeNzGs54%3D"
        run: |
          set -euo pipefail
          curl -fL "$A1S_URL" -o A1S.zip
          unzip -q A1S.zip -d a1s
          for p in \
            a1s/RC_K0/child_designs/fortification/data/CP_STATUS.csv \
            a1s/RC_K0/data/CHILD_DESIGN_STATUS.csv \
            a1s/RC_K0/data/WORKFLOW_GATES.csv \
            a1s/RC_K0/child_designs/fortification/docs/00_STATUS.md \
            a1s/RC_K0/docs/00_STATUS.md \
            a1s/RC_K0/child_designs/fortification/r0a_cp1/fixtures/profile_extrusion.request.json \
            a1s/RC_K0/provenance/FILES.sha256; do
              echo "===== $p ====="
              sed -n '1,240p' "$p"
            done
