name: Garment CAD Pro R1A CP6-R1 Build R2

on:
  push:
    branches:
      - garment-cad-pro-r1a-cp6-r1-20261001

permissions:
  actions: read
  contents: read

concurrency:
  group: garment-cad-pro-r1a-cp6-r1-build-r2
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: garment-cad-pro-r1a-cp6-r1-20261001

      - name: Download immutable CP6 predecessor
        uses: actions/download-artifact@v4
        with:
          name: WG_OSS_R0A_GARMENT_CAD_PRO_R1A_CP6_FINAL
          path: ${{ runner.temp }}/base
          repository: jinukcha/gpc-neural-networks
          run-id: 36848757183
          github-token: ${{ github.token }}

      - name: Restore and repair saved CP6-R1 source
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/work/WG_OSS_R0A_GARMENT_CAD_PRO_R1A_CP6_R1_BUILD"
          mkdir -p "$root/source" "$root/scripts" "$root/tests" "$root/godot"
          cp -a "$RUNNER_TEMP/base/." "$root/"
          cat cp6_r1_overlay_chunks/part*.b64 | base64 --decode > "$RUNNER_TEMP/cp6_r1_overlay.tar.gz"
          echo "73f802852c86d9202ab115fc180b0e93507ed6e5adaa9eed13690d63b726b172  $RUNNER_TEMP/cp6_r1_overlay.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/cp6_r1_overlay"
          tar -xzf "$RUNNER_TEMP/cp6_r1_overlay.tar.gz" -C "$RUNNER_TEMP/cp6_r1_overlay"
          cp -a "$RUNNER_TEMP/cp6_r1_overlay/source/." "$root/source/"
          cp -a "$RUNNER_TEMP/cp6_r1_overlay/scripts/." "$root/scripts/"
          cp -a "$RUNNER_TEMP/cp6_r1_overlay/tests/." "$root/tests/"
          cp -a "$RUNNER_TEMP/cp6_r1_overlay/godot/." "$root/godot/"
          chmod +x "$root/scripts/"*.py
          python - "$root/source/wuxia_garment_oss/garments/sleeveless_tunic/product_topology/primitives.py" <<'PY'
          import pathlib,sys
          path=pathlib.Path(sys.argv[1]); text=path.read_text()
          old="    signed = np.cross(local[triangles[:, 1]] - local[triangles[:, 0]], local[triangles[:, 2]] - local[triangles[:, 0]])\n"
          new=("    edge_a = local[triangles[:, 1]] - local[triangles[:, 0]]\n"
               "    edge_b = local[triangles[:, 2]] - local[triangles[:, 0]]\n"
               "    signed = edge_a[:, 0] * edge_b[:, 1] - edge_a[:, 1] * edge_b[:, 0]\n")
          assert text.count(old)==1
          path.write_text(text.replace(old,new))
          PY
          echo "ROOT=$root" >> "$GITHUB_ENV"

      - name: Install exact runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir \
            numpy==2.5.3 scipy==1.16.3 matplotlib==3.9.4 pillow==11.1.0
          wheel_dir="$RUNNER_TEMP/warp-wheel"; mkdir -p "$wheel_dir"
          python -m pip download --disable-pip-version-check --no-cache-dir --no-deps --only-binary=:all: warp-lang==1.17.0 -d "$wheel_dir"
          wheel="$(find "$wheel_dir" -type f -name 'warp_lang-1.17.0-*.whl' | head -1)"
          echo "47cd93636828dd16e55eeb4e77a0e3547b5fb0f383000a3d228629df68f28fd8  $wheel" | sha256sum -c -
          python -m pip install --disable-pip-version-check --no-cache-dir --no-deps "$wheel"

      - name: Build feature-complete product checkpoint
        shell: bash
        run: |
          set -euo pipefail
          env MPLBACKEND=Agg WARP_CACHE_PATH="$RUNNER_TEMP/warp-cache" PYTHONPATH="$ROOT/source:$ROOT/scripts" \
            python "$ROOT/scripts/run_garment_cad_pro_cp6_r1.py" --root "$ROOT"
          python - "$ROOT" <<'PY'
          import json,pathlib,sys
          b=pathlib.Path(sys.argv[1])/'build/garment_cad_pro_cp6_r1'
          t=json.loads((b/'topology/topology_receipt.json').read_text())
          s=json.loads((b/'motion_fit/motion_suite_receipt.json').read_text())
          p=json.loads((b/'cp6_r1_preliminary_receipt.json').read_text())
          assert t['topology_pass'] and t['cp3_feature_topology_embodied']
          assert (t['component_count'],t['vertex_count'],t['triangle_count'])==(14,29199,55850)
          assert s['suite_pass'] and s['pass_count']==s['scenario_count']==30 and s['acceptance_runtime']
          assert p['feature_tunic_product_written'] and p['feature_tunic_primitive_count']==14
          print(json.dumps({'topology':t,'suite':s,'preliminary':p},sort_keys=True))
          PY
          find "$ROOT" -type d \( -name __pycache__ -o -name .pytest_cache -o -name kernel_cache_bin \) -prune -exec rm -rf {} +
          find "$ROOT" -type f \( -name '*.pyc' -o -name '*.pyo' -o -name '*.whl' \) -delete

      - name: Upload resumable build checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: WG_OSS_R0A_GARMENT_CAD_PRO_R1A_CP6_R1_BUILD_CHECKPOINT
          path: ${{ env.ROOT }}
          compression-level: 6
          retention-days: 2
          if-no-files-found: error
