name: Garment CAD Pro R1A CP5 Diagnostics

on:
  push:
    branches:
      - garment-cad-pro-r1a-cp5-20261001

permissions:
  contents: write
  actions: read

jobs:
  summarize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: garment-cad-pro-r1a-cp5-20261001
          persist-credentials: true

      - name: Download completed CP5 artifact
        uses: actions/download-artifact@v4
        with:
          name: WG_OSS_R0A_GARMENT_CAD_PRO_R1A_CP5
          path: ${{ runner.temp }}/cp5
          repository: jinukcha/gpc-neural-networks
          run-id: 36835321927
          github-token: ${{ github.token }}

      - name: Aggregate failed pose gates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import collections, json, pathlib
          root = pathlib.Path('${{ runner.temp }}/cp5')
          paths = sorted((root / 'build/motion_fit_cp5/pose_receipts').glob('*/*.json'))
          rows = [json.loads(path.read_text()) for path in paths]
          failed = [row for row in rows if not row['pose_pass']]
          gate_counts = collections.Counter()
          pose_gate_counts = collections.defaultdict(collections.Counter)
          for row in failed:
              for gate, passed in row['gates'].items():
                  if not passed:
                      gate_counts[gate] += 1
                      pose_gate_counts[row['pose_id']][gate] += 1
          metric_keys = sorted(rows[0]['metrics'])
          worst = {}
          for key in metric_keys:
              values = [(float(row['metrics'][key]), row['material_id'], row['pose_id']) for row in rows]
              if 'clearance' in key and ('min' in key or 'p01' in key):
                  value, material, pose = min(values)
              else:
                  value, material, pose = max(values)
              worst[key] = {'value': value, 'material_id': material, 'pose_id': pose}
          by_pose = {}
          for pose_id in sorted({row['pose_id'] for row in rows}):
              pose_rows = [row for row in rows if row['pose_id'] == pose_id]
              by_pose[pose_id] = {
                  'pass_count': sum(bool(row['pose_pass']) for row in pose_rows),
                  'scenario_count': len(pose_rows),
                  'failed_gates': dict(sorted(pose_gate_counts[pose_id].items())),
                  'metric_ranges': {
                      key: {
                          'minimum': min(float(row['metrics'][key]) for row in pose_rows),
                          'maximum': max(float(row['metrics'][key]) for row in pose_rows),
                      }
                      for key in (
                          'strain_p99_ratio', 'pressure_p99_kpa', 'clearance_min_m',
                          'seam_tension_p95_n_m', 'contact_persistence_p99',
                          'mobility_restriction_p95', 'tail_peak_displacement_m'
                      )
                  },
              }
          summary = {
              'contract': 'CP5FailureDiagnosticSummary/1',
              'scenario_count': len(rows),
              'pass_count': sum(bool(row['pose_pass']) for row in rows),
              'failed_count': len(failed),
              'failed_gate_counts': dict(sorted(gate_counts.items())),
              'by_pose': by_pose,
              'worst_metrics': worst,
              'diagnostic_only': True,
              'simulation_reexecuted': False,
          }
          out = pathlib.Path('delivery_pro_cp5/cp5_failure_summary.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps(summary, sort_keys=True))
          PY

      - name: Publish diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'chatgpt-garment-cad'
          git config user.email 'chatgpt-garment-cad@users.noreply.github.com'
          git add delivery_pro_cp5/cp5_failure_summary.json
          git commit -m 'Publish CP5 failed-pose diagnostics [skip ci]'
          git push origin HEAD:garment-cad-pro-r1a-cp5-20261001
