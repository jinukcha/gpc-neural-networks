name: RCF R0C CP2-A freeze publication

on:
  push:
    branches: [automation/rcf-r0c-cp2a-freeze-20260926]
    paths: [.github/workflows/rcf-r0c-cp2a-freeze-publish.yml]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      TAG: rcf-r0c-cp2a-20260926-r1
      BRANCH: automation/rcf-r0c-cp2a-freeze-20260926
      BASELINE_URL: "https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-afd0-8206-9682-7fa15d60a1af/raw?se=2026-09-25T21%3A44%3A27Z&sp=r&sv=2026-02-06&sr=b&scid=4a336a2b-7e52-589e-a5d1-87e24deafcaf&skoid=0b778285-7b0b-4cdc-ac3b-fb93e8c3686f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-25T19%3A49%3A02Z&ske=2026-09-26T19%3A49%3A02Z&sks=b&skv=2026-02-06&sig=dH/JnP9y0ooX%2BtHRTvcrNYi/sRHviDjSe6XL1SOqUAk%3D"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/rcf-r0c-cp2a-freeze-20260926
          fetch-depth: 0

      - name: Download exact authority and fixed baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf cp2a_inputs cp2a_work cp2a_output
          mkdir -p cp2a_inputs cp2a_work cp2a_output
          curl -L --fail --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o cp2a_inputs/C1_transfer.zip \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/10887764464/zip"
          curl -L --fail --retry 3 -o cp2a_inputs/RCF_D0_full.zip "$BASELINE_URL"
          echo 'b8f4f6788c4295770364f722d9e40403dcdab652487404f50226f0c1995dae53  cp2a_inputs/C1_transfer.zip' | sha256sum -c -
          echo '6b705952be72036e9d6c6eaa614ddd33abe963ed9d1411f9d839b1f11e7f1cd2  cp2a_inputs/RCF_D0_full.zip' | sha256sum -c -
          unzip -t cp2a_inputs/C1_transfer.zip >/dev/null
          unzip -t cp2a_inputs/RCF_D0_full.zip >/dev/null

      - name: Compile packager and parse frozen sources
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile cp2a_tools/build_cp2a.py r0c_cp1/package_tools.py
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root = Path('cp2a_freeze_source/RC_K0/child_designs/fortification/r0c_cp2')
          json.loads((root / 'contracts/TOWER_JOIN_CONTRACT.json').read_text(encoding='utf-8'))
          with (root / 'data/CP2_FIXTURE_MATRIX.csv').open('r', encoding='utf-8', newline='') as handle:
              rows = list(csv.DictReader(handle))
          assert len(rows) == 6
          assert (root / 'docs/CP2_SCOPE_FREEZE.md').is_file()
          print('frozen source parse: PASS')
          PY

      - name: Preserve, validate and finalize CP2-A checkpoint
        id: build
        shell: bash
        run: |
          set -euo pipefail
          python cp2a_tools/build_cp2a.py \
            --transport cp2a_inputs/C1_transfer.zip \
            --baseline cp2a_inputs/RCF_D0_full.zip \
            --source-root cp2a_freeze_source \
            --work cp2a_work \
            --output cp2a_output \
            | tee cp2a_output/build.log

      - name: Upload preserved pre-checkpoint after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: C2A_PRE_FAILURE_${{ github.run_id }}
          path: |
            cp2a_output/C2A_pre.zip
            cp2a_output/C2A_preP.zip
            cp2a_output/C2A_preS.zip
            cp2a_output/C2A_pre_check.json
            cp2a_output/build.log
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7

      - name: Reopen finalized files independently
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          for f in C2A.zip C2AP.zip C2AS.zip C2AR.zip C2A_SMALL.zip; do
            unzip -t "cp2a_output/$f" >/dev/null
          done
          (cd cp2a_output && sha256sum -c C2A.sha256)
          (cd cp2a_output && sha256sum -c C2A_SMALL.sha256)
          python - <<'PY'
          import json
          from pathlib import Path
          check = json.loads(Path('cp2a_output/C2A_check.json').read_text(encoding='utf-8'))
          assert check['stage_completion'] == 'CP2_A_COMPLETE_CLOSED'
          assert check['r0c_cp2'] == 'OPEN'
          assert check['validation']['status'] == 'PASS'
          assert check['validation']['baseline_plus_c2ap_equals_full']['status'] == 'PASS'
          assert check['validation']['c1_plus_source_equals_full']['status'] == 'PASS'
          print('independent finalized reopen: PASS')
          PY

      - name: Commit small accepted result set
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf cp2a_result
          mkdir -p cp2a_result
          cp cp2a_output/C2AS.zip cp2a_result/
          cp cp2a_output/C2AR.zip cp2a_result/
          cp cp2a_output/C2A_check.json cp2a_result/
          cp cp2a_output/C2A_delivery.json cp2a_result/
          cp cp2a_output/C2A_report.md cp2a_result/
          cp cp2a_output/C2A.sha256 cp2a_result/
          cp cp2a_output/C2A_release.json cp2a_result/
          cp cp2a_output/C2A_SMALL.zip cp2a_result/
          cp cp2a_output/C2A_SMALL.sha256 cp2a_result/
          cp cp2a_output/C2A_pre_check.json cp2a_result/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cp2a_result
          git commit -m 'Publish accepted R0C CP2-A freeze checkpoint receipts'
          git push origin HEAD:$BRANCH

      - name: Publish final release assets
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files=(
            cp2a_output/C2A.zip
            cp2a_output/C2AP.zip
            cp2a_output/C2AS.zip
            cp2a_output/C2AR.zip
            cp2a_output/C2A_check.json
            cp2a_output/C2A_delivery.json
            cp2a_output/C2A_report.md
            cp2a_output/C2A.sha256
            cp2a_output/C2A_release.json
            cp2a_output/C2A_SMALL.zip
            cp2a_output/C2A_SMALL.sha256
            cp2a_output/C2A_pre_check.json
          )
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --title 'RCF R0C CP2-A freeze publication' --notes-file cp2a_output/C2A_RELEASE_NOTES.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "${files[@]}" \
              --target "$BRANCH" \
              --title 'RCF R0C CP2-A freeze publication' \
              --notes-file cp2a_output/C2A_RELEASE_NOTES.md \
              --repo "$GITHUB_REPOSITORY"
          fi

      - name: Upload compact delivery
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: C2A_SMALL
          path: cp2a_work/small_delivery/*
          compression-level: 9
          retention-days: 7
