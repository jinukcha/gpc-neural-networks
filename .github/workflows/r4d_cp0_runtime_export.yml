name: r4d-cp0-runtime-export

on:
  push:
    branches:
      - automation/r4d-cp0-runtime-20260929

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Create cleanup placeholder
        shell: bash
        run: |
          mkdir -p export
          printf 'temporary local cleanup artifact\n' > export/placeholder.txt
      - name: Upload cleanup artifact
        uses: actions/upload-artifact@v4
        with:
          name: r4d-cp0-runtime-cleanup
          path: export/
          compression-level: 9
          retention-days: 1
          if-no-files-found: error
