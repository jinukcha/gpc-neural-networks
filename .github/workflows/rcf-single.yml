name: RCF current source single bundle
on:
  push:
    branches: [automation/rcf-cp3-single-20260926]
    paths: ['.github/workflows/rcf-single.yml', 'single_bundle/package_run.py']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: rcf-single-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Read current available full source without ancestral replay
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rcf" single_result
          gh api /repos/$GITHUB_REPOSITORY/actions/artifacts/10907856074/zip > "$RUNNER_TEMP/rcf/input.zip"
          python - <<'PY'
          import os,json,zipfile,hashlib,shutil
          from pathlib import Path,PurePosixPath
          temp=Path(os.environ['RUNNER_TEMP'])/'rcf'
          with zipfile.ZipFile(temp/'input.zip') as outer:
              order={'C3A.zip':0,'C3A_pre.zip':1,'C2.zip':2,'C2_pre.zip':3}
              candidates=[n for n in outer.namelist() if PurePosixPath(n).name in order]
              selected=min(candidates,key=lambda n:order[PurePosixPath(n).name])
              with outer.open(selected) as src,(temp/'current.zip').open('wb') as dst:shutil.copyfileobj(src,dst)
          tree=temp/'tree';tree.mkdir()
          with zipfile.ZipFile(temp/'current.zip') as z:
              for info in z.infolist():
                  p=PurePosixPath(info.filename)
                  if p.is_absolute() or '..' in p.parts or '\\' in info.filename:raise ValueError('unsafe ZIP path')
                  if ((info.external_attr>>16)&0o170000)==0o120000:raise ValueError('symlink member')
              z.extractall(tree)
          report={'selected_source':selected,'source_zip_bytes':(temp/'current.zip').stat().st_size,'source_zip_sha256':hashlib.sha256((temp/'current.zip').read_bytes()).hexdigest()}
          Path('single_result/inventory.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY
      - name: Integrate CP3 source, prune generated evidence, run one CAD smoke
        shell: bash
        run: |
          set -euo pipefail
          python single_bundle/package_run.py --tree "$RUNNER_TEMP/rcf/tree" --output "$RUNNER_TEMP/rcf/delivery"
      - name: Upload the integrated directory as ONE archive, no nested delivery ZIP
        id: delivery
        uses: actions/upload-artifact@v4
        with:
          name: RCF
          path: ${{ runner.temp }}/rcf/delivery/
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 9
          retention-days: 30
      - name: Reopen the actual delivered archive once
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.delivery.outputs.artifact-id }}
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip > "$RUNNER_TEMP/rcf/RCF.zip"
          python - <<'PY'
          import os,json,zipfile,hashlib
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'rcf/RCF.zip'
          with zipfile.ZipFile(p) as z:
              bad=z.testzip()
              if bad:raise ValueError('Delivered ZIP CRC failure: '+bad)
              assert 'STATUS.json' in z.namelist() and 'START_HERE.md' in z.namelist()
              nested=[n for n in z.namelist() if n.lower().endswith('.zip')]
              assert not nested,nested
              rows=z.read('FILES.sha256').decode().splitlines()
              for row in rows:
                  digest,name=row.split('  ',1)
                  assert hashlib.sha256(z.read(name)).hexdigest()==digest,name
              file_count=len(z.namelist())
          result=json.loads(Path('single_result/result.json').read_text())
          result['delivery']={'filename':'RCF.zip','artifact_id':int(os.environ['ARTIFACT_ID']),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'files':file_count,'zip_crc':'PASS','transport_inventory':'PASS','nested_delivery_zips':0}
          Path('single_result/result.json').write_text(json.dumps(result,indent=2,ensure_ascii=False)+'\n')
          print(json.dumps(result,indent=2,ensure_ascii=False))
          PY
      - name: Record compact result only, never commit archives or full logs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f single_result
          if ! git diff --cached --quiet; then
            git commit -m 'Record one integrated RCF delivery result [skip ci]'
            git push origin HEAD:automation/rcf-cp3-single-20260926
          fi
