name: RCF R0B CP3 inspect accepted B2

on:
  push:
    branches: [automation/rcf-r0b-cp3-20260925]
    paths: [.github/workflows/rcf-r0b-cp3-inspect-b2.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/rcf-r0b-cp3-20260925
          fetch-depth: 0
      - name: Download accepted B2 and copy focused source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _b2 cp3_inspect_b2 B2.zip
          curl -L --fail --retry 3 -o B2.zip \
            https://github.com/jinukcha/gpc-neural-networks/releases/download/rcf-r0b-cp2-20260925-r1/B2.zip
          echo '51a37e5a79722ea4af4bd05004e73c6e50bb0049e625c4b7c6a5669a2c01646a  B2.zip' | sha256sum -c -
          mkdir -p _b2 cp3_inspect_b2
          unzip -q B2.zip -d _b2
          find _b2 -type f -printf '%P\n' | sort > cp3_inspect_b2/all-paths.txt
          grep -E 'RC_K0/child_designs/fortification/(r0b_cp1|r0b_cp2|data|docs)/' cp3_inspect_b2/all-paths.txt > cp3_inspect_b2/focused-paths.txt || true
          for d in r0b_cp1 r0b_cp2 data docs; do
            src="_b2/RC_K0/child_designs/fortification/$d"
            if [[ -e "$src" ]]; then
              mkdir -p "cp3_inspect_b2/fortification"
              cp -a "$src" "cp3_inspect_b2/fortification/"
            fi
          done
          find cp3_inspect_b2 -type d -name __pycache__ -prune -exec rm -rf {} +
          find cp3_inspect_b2 -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          find cp3_inspect_b2/fortification -type f -printf '%P\n' | sort > cp3_inspect_b2/fortification-files.txt
          {
            echo '=== SYMBOLS ==='
            grep -RInE '^(class|def) |centerline|local frame|terrain|foundation|grade|contact|gap|retaining|step|socket|profile|PART_ORDER' cp3_inspect_b2/fortification --include='*.py' | head -2500 || true
          } > cp3_inspect_b2/symbols.txt
          du -sh cp3_inspect_b2
      - name: Commit focused inspection
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cp3_inspect_b2
          git commit -m 'Record focused accepted B2 source for R0B CP3'
          git push origin HEAD:automation/rcf-r0b-cp3-20260925
