name: Garment sizing CP1 package

on:
  push:
    branches:
      - garment-sizing-r0a-cp1-20261001

permissions:
  contents: write
  actions: read

concurrency:
  group: garment-sizing-r0a-cp1-20261001
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: garment-sizing-r0a-cp1-20261001
          persist-credentials: true

      - name: Download sizing design baseline
        uses: actions/download-artifact@v4
        with:
          name: WG_OSS_R0A_CP2B_R4_REV1_CP3_SIZING_DESIGN
          path: ${{ runner.temp }}/base
          repository: jinukcha/gpc-neural-networks
          run-id: 36708519608
          github-token: ${{ github.token }}

      - name: Overlay CP1 implementation and preserve product authority
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/work/WG_OSS_R0A_CP2B_R4_REV1_GARMENT_SIZING_CP1"
          mkdir -p "$root/source" "$root/scripts" "$root/tests"
          cp -a "$RUNNER_TEMP/base/." "$root/"
          before_drape="$(find "$root/source/wuxia_garment_oss/drape" -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          before_mesh="$(sha256sum "$root/build/tunic_pilot/warp_cp3/final_simulation_mesh.npz" | awk '{print $1}')"
          before_png="$(sha256sum "$root/build/tunic_pilot/warp_cp3/cp3_frame180_evidence.png" | awk '{print $1}')"
          before_receipt="$(sha256sum "$root/build/tunic_pilot/warp_cp3/cp3_receipt.json" | awk '{print $1}')"
          cp -a cp1_overlay/source/. "$root/source/"
          cp -a cp1_overlay/scripts/. "$root/scripts/"
          cp -a cp1_overlay/tests/. "$root/tests/"
          chmod +x "$root/scripts/"*.py
          after_drape="$(find "$root/source/wuxia_garment_oss/drape" -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          after_mesh="$(sha256sum "$root/build/tunic_pilot/warp_cp3/final_simulation_mesh.npz" | awk '{print $1}')"
          after_png="$(sha256sum "$root/build/tunic_pilot/warp_cp3/cp3_frame180_evidence.png" | awk '{print $1}')"
          after_receipt="$(sha256sum "$root/build/tunic_pilot/warp_cp3/cp3_receipt.json" | awk '{print $1}')"
          test "$before_drape" = "$after_drape"
          test "$before_mesh" = "$after_mesh"
          test "$before_png" = "$after_png"
          test "$before_receipt" = "$after_receipt"
          echo "ROOT=$root" >> "$GITHUB_ENV"
          echo "DRAPE_HASH=$after_drape" >> "$GITHUB_ENV"
          echo "MESH_HASH=$after_mesh" >> "$GITHUB_ENV"
          echo "PNG_HASH=$after_png" >> "$GITHUB_ENV"
          echo "CP3_RECEIPT_HASH=$after_receipt" >> "$GITHUB_ENV"

      - name: Install bounded CP1 tooling
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          numpy==2.1.3 matplotlib==3.9.4 pillow==11.1.0
          pytest==8.3.5 jsonschema==4.25.1

      - name: Execute CP1 selection pilot
        run: >-
          env MPLBACKEND=Agg PYTHONPATH="$ROOT/source"
          python "$ROOT/scripts/run_garment_sizing_cp1.py" --root "$ROOT"

      - name: Test contracts and selection
        run: >-
          env PYTHONPATH="$ROOT/source"
          pytest -q "$ROOT/tests/test_garment_sizing_cp1.py"

      - name: Validate outputs and source budget
        run: python "$ROOT/scripts/validate_garment_sizing_cp1.py" --root "$ROOT"

      - name: Validate schemas and diet bundle
        shell: bash
        run: |
          set -euo pipefail
          python -c "import json,pathlib; from jsonschema import Draft202012Validator; p=pathlib.Path('$ROOT/contracts/sizing'); s=list(p.glob('*.schema.json')); assert len(s)==9; [Draft202012Validator.check_schema(json.loads(x.read_text())) for x in s]"
          find "$ROOT" -type d \( -name __pycache__ -o -name .pytest_cache \) -prune -exec rm -rf {} +
          find "$ROOT" -type f \( -name '*.pyc' -o -name '*.pyo' -o -name '*.blend1' -o -name '*.whl' \) -delete
          python "$ROOT/scripts/write_manifest.py" --root "$ROOT"
          (cd "$ROOT" && sha256sum -c MANIFEST.sha256)

      - name: Publish CP1 PNG evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf delivery_cp1
          mkdir -p delivery_cp1
          cp "$ROOT/build/tunic_pilot/sizing_cp1/cp1_selection_evidence.png" delivery_cp1/
          cp "$ROOT/build/tunic_pilot/sizing_cp1/cp1_receipt.json" delivery_cp1/
          cp "$ROOT/SIZING_STATUS.json" delivery_cp1/
          git config user.name 'chatgpt-garment-sizing'
          git config user.email 'chatgpt-garment-sizing@users.noreply.github.com'
          git add delivery_cp1
          git commit -m 'Publish garment sizing CP1 evidence [skip ci]'
          git push origin HEAD:garment-sizing-r0a-cp1-20261001

      - name: Upload single integrated CP1 bundle
        uses: actions/upload-artifact@v4
        with:
          name: WG_OSS_R0A_CP2B_R4_REV1_GARMENT_SIZING_CP1
          path: ${{ env.ROOT }}
          compression-level: 6
          retention-days: 2
          if-no-files-found: error
