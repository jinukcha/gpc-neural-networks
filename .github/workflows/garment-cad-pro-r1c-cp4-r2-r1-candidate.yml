name: Garment CAD Pro R1C CP4-R2-R1 Candidate

on:
  push:
    branches:
      - garment-cad-pro-r1c-cp4-r2-r1-20261002

permissions:
  actions: read
  contents: write

concurrency:
  group: garment-cad-pro-r1c-cp4-r2-r1-candidate
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: garment-cad-pro-r1c-cp4-r2-r1-20261002
          persist-credentials: true

      - name: Download immutable CP4-R1 integrated predecessor
        uses: actions/download-artifact@v4
        with:
          name: GARMENT_R1C_CP4_R1_FINAL
          path: ${{ runner.temp }}/base
          repository: jinukcha/gpc-neural-networks
          run-id: 36986369125
          github-token: ${{ github.token }}

      - name: Restore CP4-R1 and overlay CP4-R2-R1 kernel
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/work/GARMENT_R1C_CP4_R2_R1_CANDIDATE"
          mkdir -p "$root/source" "$root/scripts" "$root/tests"
          cp -a "$RUNNER_TEMP/base/." "$root/"
          python - "$RUNNER_TEMP/base" "$RUNNER_TEMP/predecessor.json" <<'PY'
          import hashlib,json,pathlib,sys
          base=pathlib.Path(sys.argv[1]); target=pathlib.Path(sys.argv[2])
          def tree_hash(path):
              digest=hashlib.sha256()
              for item in sorted(x for x in path.rglob('*') if x.is_file()):
                  if '__pycache__' in item.parts or item.suffix in {'.pyc','.pyo'}: continue
                  digest.update(item.relative_to(path).as_posix().encode())
                  digest.update(hashlib.sha256(item.read_bytes()).digest())
              return digest.hexdigest()
          payload={
              'cp4_r1_build_tree':tree_hash(base/'build/r1c_cp4_r1'),
              'source_files':{
                  path.relative_to(base/'source').as_posix():hashlib.sha256(path.read_bytes()).hexdigest()
                  for path in (base/'source').rglob('*')
                  if path.is_file() and '__pycache__' not in path.parts and path.suffix in {'.py','.gd'}
              },
          }
          target.write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          PY
          cp -a r1c_cp4_r2_r1_overlay/source/. "$root/source/"
          cp -a r1c_cp4_r2_r1_overlay/scripts/. "$root/scripts/"
          cp -a r1c_cp4_r2_r1_overlay/tests/. "$root/tests/"
          chmod +x "$root/scripts/"*cp4_r2_r1.py
          echo "ROOT=$root" >> "$GITHUB_ENV"

      - name: Install bounded candidate tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir \
            numpy==2.5.3 scipy==1.16.3 matplotlib==3.9.4 pillow==11.1.0 \
            pytest==8.3.5 warp-lang==1.17.0

      - name: Decompose and repair metric fidelity
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$ROOT/source" \
            python "$ROOT/scripts/run_garment_r1c_cp4_r2_r1.py" --root "$ROOT"

      - name: Render identical-camera Blender 5.2.2 after views
        shell: bash
        run: |
          set -euo pipefail
          blender_archive="$RUNNER_TEMP/blender-5.2.2-linux-x64.tar.xz"
          curl -L --fail --retry 3 -o "$blender_archive" \
            https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/blender-5.2.2.sha256" \
            https://download.blender.org/release/Blender5.2/blender-5.2.2.sha256
          expected=$(grep 'blender-5.2.2-linux-x64.tar.xz' "$RUNNER_TEMP/blender-5.2.2.sha256" | awk '{print $1}')
          test -n "$expected"
          echo "$expected  $blender_archive" | sha256sum -c -
          tar -xf "$blender_archive" -C "$RUNNER_TEMP"
          blender="$RUNNER_TEMP/blender-5.2.2-linux-x64/blender"
          xvfb-run -a "$blender" --background --factory-startup \
            --python "$ROOT/scripts/blender_render_garment_r1c_cp4_r2_r1.py" -- --root "$ROOT"
          rm -rf "$RUNNER_TEMP/blender-5.2.2-linux-x64" "$blender_archive" "$RUNNER_TEMP/blender-5.2.2.sha256"

      - name: Compose identical-camera before and after evidence
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$ROOT/source" \
            python "$ROOT/scripts/compose_garment_r1c_cp4_r2_r1_evidence.py" --root "$ROOT"

      - name: Test metric candidate
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$ROOT/source" pytest -q "$ROOT/tests/test_garment_r1c_cp4_r2_r1.py"
          python - "$ROOT" <<'PY'
          import ast,json,pathlib,sys
          root=pathlib.Path(sys.argv[1])
          files=sorted((root/'source/wuxia_garment_oss/materialization/metric_fidelity').glob('*.py'))
          files+=sorted((root/'scripts').glob('*cp4_r2_r1*.py'))
          files+=sorted((root/'tests').glob('*cp4_r2_r1*.py'))
          over_files=[]; over_functions=[]; max_file=('',0); max_fn=('','',0)
          for path in files:
              text=path.read_text(); lines=len(text.splitlines()); rel=path.relative_to(root).as_posix()
              if lines>max_file[1]: max_file=(rel,lines)
              if lines>500: over_files.append((rel,lines))
              for node in ast.walk(ast.parse(text)):
                  if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)) and node.end_lineno:
                      length=node.end_lineno-node.lineno+1
                      if length>max_fn[2]: max_fn=(rel,node.name,length)
                      if length>80: over_functions.append((rel,node.name,length))
          assert not over_files,over_files
          assert not over_functions,over_functions
          target=root/'build/r1c_cp4_r2_r1/source_budget.json'
          target.write_text(json.dumps({'files_checked':len(files),'maximum_file':max_file,'maximum_function':max_fn,'files_over_500':over_files,'functions_over_80':over_functions},indent=2)+'\n')
          PY

      - name: Verify immutable CP4-R1 predecessor
        shell: bash
        run: |
          set -euo pipefail
          find "$ROOT/source" -type d -name __pycache__ -prune -exec rm -rf {} +
          find "$ROOT/source" -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          python - "$ROOT" "$RUNNER_TEMP/predecessor.json" <<'PY'
          import hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1]); before=json.loads(pathlib.Path(sys.argv[2]).read_text())
          def tree_hash(path):
              digest=hashlib.sha256()
              for item in sorted(x for x in path.rglob('*') if x.is_file()):
                  if '__pycache__' in item.parts or item.suffix in {'.pyc','.pyo'}: continue
                  digest.update(item.relative_to(path).as_posix().encode())
                  digest.update(hashlib.sha256(item.read_bytes()).digest())
              return digest.hexdigest()
          changed=[]
          for rel,expected in before['source_files'].items():
              path=root/'source'/rel
              actual=hashlib.sha256(path.read_bytes()).hexdigest() if path.is_file() else None
              if actual!=expected: changed.append(rel)
          after=tree_hash(root/'build/r1c_cp4_r1')
          payload={
              'contract':'R1CCP4R2R1PredecessorPreservationReceipt/1',
              'cp4_r1_tree_before':before['cp4_r1_build_tree'],
              'cp4_r1_tree_after':after,
              'changed_predecessor_source_files':changed,
              'all_predecessors_unchanged':after==before['cp4_r1_build_tree'] and not changed,
          }
          payload['receipt_sha256']=hashlib.sha256(json.dumps(payload,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          target=root/'build/r1c_cp4_r2_r1/predecessor_preservation.json'
          target.write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          assert payload['all_predecessors_unchanged'],payload
          PY

      - name: Diet and manifest candidate
        shell: bash
        run: |
          set -euo pipefail
          find "$ROOT" -type d \( -name __pycache__ -o -name .pytest_cache -o -name kernel_cache_bin -o -name .godot \) -prune -exec rm -rf {} +
          find "$ROOT" -type f \( -name '*.pyc' -o -name '*.pyo' -o -name '*.blend1' -o -name '*.whl' \) -delete
          python "$ROOT/scripts/write_manifest.py" --root "$ROOT"
          (cd "$ROOT" && sha256sum -c MANIFEST.sha256 >/dev/null)

      - name: Publish candidate evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf delivery_r1c_cp4_r2_r1_candidate
          mkdir -p delivery_r1c_cp4_r2_r1_candidate/after delivery_r1c_cp4_r2_r1_candidate/comparison
          cp "$ROOT/build/r1c_cp4_r2_r1/cp4_r2_r1_before_after_contact_sheet.png" delivery_r1c_cp4_r2_r1_candidate/
          cp "$ROOT/build/r1c_cp4_r2_r1/"*.json delivery_r1c_cp4_r2_r1_candidate/
          cp "$ROOT/build/r1c_cp4_r2_r1/visual/after/"*.png delivery_r1c_cp4_r2_r1_candidate/after/
          cp "$ROOT/build/r1c_cp4_r2_r1/visual/comparison/"*.png delivery_r1c_cp4_r2_r1_candidate/comparison/
          git config user.name 'chatgpt-garment-cad'
          git config user.email 'chatgpt-garment-cad@users.noreply.github.com'
          git add delivery_r1c_cp4_r2_r1_candidate
          if ! git diff --cached --quiet; then
            git commit -m 'Publish CP4-R2-R1 metric candidate evidence [skip ci]'
            git push origin HEAD:garment-cad-pro-r1c-cp4-r2-r1-20261002
          fi

      - name: Upload metric candidate
        uses: actions/upload-artifact@v4
        with:
          name: GARMENT_R1C_CP4_R2_R1_CANDIDATE
          path: ${{ env.ROOT }}
          compression-level: 6
          retention-days: 2
          if-no-files-found: error
