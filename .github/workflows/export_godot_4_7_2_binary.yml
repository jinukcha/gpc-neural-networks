name: Export Godot 4.7.2 Binary

on:
  push:
    branches:
      - tmp-player-flight-p0a-validate-20260916
    paths:
      - .github/workflows/export_godot_4_7_2_binary.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download official Godot 4.7.2 Linux binary
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-all-errors \
            -o Godot_v4.7.2-stable_linux.x86_64.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          ./Godot_v4.7.2-stable_linux.x86_64 --version | tee GODOT_VERSION.txt

      - name: Upload binary archive
        uses: actions/upload-artifact@v4
        with:
          name: godot-4-7-2-linux-x86-64
          path: |
            Godot_v4.7.2-stable_linux.x86_64.zip
            GODOT_VERSION.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
