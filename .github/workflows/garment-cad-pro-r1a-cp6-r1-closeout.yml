name: Garment CAD Pro R1A CP6-R1 Preservation Diagnostic

on:
  push:
    branches:
      - garment-cad-pro-r1a-cp6-r1-20261001

permissions:
  actions: read
  contents: read

concurrency:
  group: garment-cad-pro-r1a-cp6-r1-preservation-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: garment-cad-pro-r1a-cp6-r1-20261001

      - name: Download accepted CP6-R1 build checkpoint
        uses: actions/download-artifact@v4
        with:
          name: WG_OSS_R0A_GARMENT_CAD_PRO_R1A_CP6_R1_BUILD_CHECKPOINT
          path: ${{ runner.temp }}/work
          repository: jinukcha/gpc-neural-networks
          run-id: 36855164606
          github-token: ${{ github.token }}

      - name: Download immutable CP6 predecessor
        uses: actions/download-artifact@v4
        with:
          name: WG_OSS_R0A_GARMENT_CAD_PRO_R1A_CP6_FINAL
          path: ${{ runner.temp }}/base
          repository: jinukcha/gpc-neural-networks
          run-id: 36848757183
          github-token: ${{ github.token }}

      - name: Print exact source differences
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/base" "$RUNNER_TEMP/work" <<'PY'
          import hashlib,json,pathlib,sys
          base=pathlib.Path(sys.argv[1]); work=pathlib.Path(sys.argv[2])
          roots=(
            'source/wuxia_garment_oss/pattern_cad',
            'source/wuxia_garment_oss/qualification',
            'source/wuxia_garment_oss/sizing',
          )
          def file_map(root):
            return {p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          result={}
          for name in roots:
            before=file_map(base/name); after=file_map(work/name)
            result[name]={
              'added':sorted(set(after)-set(before)),
              'removed':sorted(set(before)-set(after)),
              'changed':sorted(k for k in set(before)&set(after) if before[k]!=after[k]),
            }
          print('CP6_R1_PRESERVATION_DIFF='+json.dumps(result,sort_keys=True))
          PY
