name: One-shot Godot 4.7.2 Linux intake for W07

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-godot-472-w07.yml

permissions:
  contents: read

jobs:
  intake:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download and verify exact official archive
        run: |
          set -euo pipefail
          archive=Godot_v4.7.2-stable_linux.x86_64.zip
          curl -L --fail --retry 4 \
            -o "$archive" \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $archive" | sha256sum -c -
          mkdir verify
          unzip -q "$archive" -d verify
          executable=verify/Godot_v4.7.2-stable_linux.x86_64
          echo "8d106cbe6144c2dc7e881d61d2429c1a8a76e6b22ef48bd5e48dcf934953f71e  $executable" | sha256sum -c -
          chmod +x "$executable"
          test "$("$executable" --version)" = "4.7.2.stable.official.ed1daf0bf"
      - name: Upload exact official archive
        uses: actions/upload-artifact@v4
        with:
          name: Godot_v4.7.2-stable_linux.x86_64
          path: Godot_v4.7.2-stable_linux.x86_64.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
