name: Garment CAD Pro R1A CP2

on:
  push:
    branches:
      - garment-cad-pro-r1a-cp2-20261001

permissions:
  contents: write
  actions: read

concurrency:
  group: garment-cad-pro-r1a-cp2-20261001
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: garment-cad-pro-r1a-cp2-20261001
          persist-credentials: true

      - name: Download CP1 integrated predecessor
        uses: actions/download-artifact@v4
        with:
          name: WG_OSS_R0A_GARMENT_CAD_PRO_R1A_CP1_RECOVERY
          path: ${{ runner.temp }}/base
          repository: jinukcha/gpc-neural-networks
          run-id: 36824376282
          github-token: ${{ github.token }}

      - name: Overlay CP2 implementation and preserve predecessors
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/work/WG_OSS_R0A_GARMENT_CAD_PRO_R1A_CP2"
          mkdir -p "$root/source" "$root/scripts" "$root/tests"
          cp -a "$RUNNER_TEMP/base/." "$root/"
          tree_hash() {
            python -c 'import hashlib,pathlib,sys; p=pathlib.Path(sys.argv[1]); d=hashlib.sha256(); items=sorted(x for x in p.rglob("*") if x.is_file()); [(d.update(x.relative_to(p).as_posix().encode("utf-8")),d.update(hashlib.sha256(x.read_bytes()).digest())) for x in items]; print(d.hexdigest())' "$1"
          }
          pattern_hash="$(tree_hash "$root/build/pattern_cad_cp1")"
          tunic_hash="$(tree_hash "$root/build/tunic_pilot")"
          sizing_hash="$(tree_hash "$root/source/wuxia_garment_oss/sizing")"
          drape_hash="$(tree_hash "$root/source/wuxia_garment_oss/drape")"
          cp -a cp2_pro_overlay/source/. "$root/source/"
          cp -a cp2_pro_overlay/scripts/. "$root/scripts/"
          cp -a cp2_pro_overlay/tests/. "$root/tests/"
          chmod +x "$root/scripts/"*.py
          sed -i 's#build/pattern_cad_cp1/documents/tunic_m_pattern_document.json#build/pattern_cad_cp1/pattern_document.json#' "$root/scripts/run_garment_cad_pro_cp2.py"
          test "$pattern_hash" = "$(tree_hash "$root/build/pattern_cad_cp1")"
          test "$tunic_hash" = "$(tree_hash "$root/build/tunic_pilot")"
          test "$sizing_hash" = "$(tree_hash "$root/source/wuxia_garment_oss/sizing")"
          test "$drape_hash" = "$(tree_hash "$root/source/wuxia_garment_oss/drape")"
          printf '\n## CP2 구현 상태\n\nCP2는 committed PatternDocument를 immutable predecessor로 사용해 arbitrary-N grade rule, named grade point, exact-curve propagation, notch normalized arc-position과 dart·pleat·gather·gusset feature graph를 발행한다. Feature는 CP1 atomic transaction store에서 적용하며 rejected operation은 revision과 document hash를 보존한다. Triangulation과 Warp product simulation은 실행하지 않는다.\n' >> "$root/docs/architecture/professional/PARAMETRIC_PATTERN_CAD_KERNEL_KO.md"
          printf '\n## CP2 결과\n\n- arbitrary-N industrial grading: 구현\n- named grade point와 exact curve propagation: 구현\n- notch arc-position preservation: 구현\n- dart·pleat·gather·gusset feature graph: 구현\n- stable-ID mapping과 failure atomicity: 구현\n- triangulation / Warp: 미실행\n- 다음 단계: CP3 ConstructionGraph / SeamSpec/2 / allowance / closures / lining-interfacing\n' >> "$root/docs/roadmap/GARMENT_CAD_PRO_R1A_ROADMAP_KO.md"
          echo "ROOT=$root" >> "$GITHUB_ENV"
          echo "EXPECTED_PATTERN_CAD_CP1_HASH=$pattern_hash" >> "$GITHUB_ENV"
          echo "EXPECTED_TUNIC_BUILD_HASH=$tunic_hash" >> "$GITHUB_ENV"
          echo "EXPECTED_SIZING_SOURCE_HASH=$sizing_hash" >> "$GITHUB_ENV"
          echo "EXPECTED_DRAPE_SOURCE_HASH=$drape_hash" >> "$GITHUB_ENV"

      - name: Install bounded CP2 tooling
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          matplotlib==3.9.4 pillow==11.1.0 pytest==8.3.5 jsonschema==4.25.1

      - name: Execute CP2 grading and feature graph
        run: >-
          env MPLBACKEND=Agg PYTHONPATH="$ROOT/source"
          python "$ROOT/scripts/run_garment_cad_pro_cp2.py" --root "$ROOT"

      - name: Test CP1 and CP2 pattern CAD
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$ROOT/source" pytest -q \
            "$ROOT/tests/test_garment_cad_pro_cp1.py" \
            "$ROOT/tests/test_garment_cad_pro_cp2.py"

      - name: Validate CP2 outputs and source budget
        shell: bash
        run: |
          set -euo pipefail
          find "$ROOT" -type d -name __pycache__ -prune -exec rm -rf {} +
          find "$ROOT" -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          python "$ROOT/scripts/validate_garment_cad_pro_cp2.py" --root "$ROOT"

      - name: Validate schemas and diet bundle
        shell: bash
        run: |
          set -euo pipefail
          python -c "import json,pathlib; from jsonschema import Draft202012Validator; p=pathlib.Path('$ROOT/contracts/pattern_cad'); s=sorted(p.glob('*.schema.json')); assert len(s)==4; [Draft202012Validator.check_schema(json.loads(x.read_text())) for x in s]"
          find "$ROOT" -type d \( -name __pycache__ -o -name .pytest_cache \) -prune -exec rm -rf {} +
          find "$ROOT" -type f \( -name '*.pyc' -o -name '*.pyo' -o -name '*.blend1' -o -name '*.whl' \) -delete
          python "$ROOT/scripts/write_manifest.py" --root "$ROOT"
          (cd "$ROOT" && sha256sum -c MANIFEST.sha256)

      - name: Publish CP2 PNG evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf delivery_pro_cp2
          mkdir -p delivery_pro_cp2
          cp "$ROOT/build/pattern_cad_cp2/cp2_grading_feature_evidence.png" delivery_pro_cp2/
          cp "$ROOT/build/pattern_cad_cp2/cp2_receipt.json" delivery_pro_cp2/
          cp "$ROOT/PROFESSIONAL_STATUS.json" delivery_pro_cp2/
          git config user.name 'chatgpt-garment-cad'
          git config user.email 'chatgpt-garment-cad@users.noreply.github.com'
          git add delivery_pro_cp2
          if ! git diff --cached --quiet; then
            git commit -m 'Publish garment CAD Pro CP2 evidence [skip ci]'
            git push origin HEAD:garment-cad-pro-r1a-cp2-20261001
          fi

      - name: Upload single integrated CP2 bundle
        uses: actions/upload-artifact@v4
        with:
          name: WG_OSS_R0A_GARMENT_CAD_PRO_R1A_CP2
          path: ${{ env.ROOT }}
          compression-level: 6
          retention-days: 2
          if-no-files-found: error
